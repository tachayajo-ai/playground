<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Grammar Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: study-guide column; sticky segmented nav; every sentence can be shown as colored S/V/O/C/A slots */
:root {
  --bg: #F6F7FA; --surface: #FFFFFF; --sunk: #ECEEF4; --ink: #171B30; --muted: #5C6381; --line: #DADDE8;
  --accent: #3446C9; --accent-soft: #E4E7FA; --mark: #FFE58A;
  --ok: #1F7A4D; --ok-soft: #DDF1E6; --bad: #B83A30; --bad-soft: #F8E0DD;
  --sS: #2F5BD3; --sV: #C8372D; --sO: #1E8A5B; --sC: #8A3FC4; --sA: #A86A12; --sX: #6B7186;
  --f-display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1120; --surface: #181B2E; --sunk: #21253B; --ink: #E8EAF5; --muted: #A0A6C3; --line: #2E3350;
  --accent: #8E9BFF; --accent-soft: #272D55; --mark: #6B5A12;
  --ok: #5FD39A; --ok-soft: #173528; --bad: #FF8A7E; --bad-soft: #3E1E1C;
  --sS: #7EA0FF; --sV: #FF7E73; --sO: #5FD39A; --sC: #C99BFF; --sA: #F1B85A; --sX: #9AA0B8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1120; --surface: #181B2E; --sunk: #21253B; --ink: #E8EAF5; --muted: #A0A6C3; --line: #2E3350;
  --accent: #8E9BFF; --accent-soft: #272D55; --mark: #6B5A12;
  --ok: #5FD39A; --ok-soft: #173528; --bad: #FF8A7E; --bad-soft: #3E1E1C;
  --sS: #7EA0FF; --sV: #FF7E73; --sO: #5FD39A; --sC: #C99BFF; --sA: #F1B85A; --sX: #9AA0B8;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 760px; margin: 0 auto; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .col { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0; margin-right: auto; }
.logo i { font-style: normal; color: var(--accent); }
.seg { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.seg a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
.seg a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

main { padding-block: 20px 60px; }
h1, h2, h3 { text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 4px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; margin: 0 0 8px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.en { font-family: var(--f-display); }
.block { margin-top: 26px; }
.note { font-size: 13px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-size: 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.primary { color: #0F1120; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1120; } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Strategy */
.strategy { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 13px; font-family: var(--f-display); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: 13px; }

/* Lesson list */
.part { margin-top: 22px; }
.part > .eyebrow { margin-bottom: 8px; display: block; }
.lessons { display: grid; gap: 8px; }
.li { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; }
.li .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.li .t { font-family: var(--f-display); font-weight: 600; font-size: 16px; display: block; line-height: 1.3; }
.li .d { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 2px 8px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--ok-soft); color: var(--ok); }
.pill.weak { background: var(--bad-soft); color: var(--bad); }

/* Slots */
.sent { font-family: var(--f-display); font-size: 17px; line-height: 2.5; }
.slot { position: relative; display: inline; border-bottom: 3px solid var(--c); padding-bottom: 1px; }
.slot b { position: relative; top: -0.95em; font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--c); margin-right: 2px; letter-spacing: 0; }
.k-S { --c: var(--sS); } .k-V { --c: var(--sV); } .k-O { --c: var(--sO); } .k-C { --c: var(--sC); } .k-A { --c: var(--sA); } .k-X { --c: var(--sX); }
.swatch { display: inline-flex; gap: 6px; align-items: center; }
.swatch::before { content: ""; width: 14px; height: 3px; background: var(--c); border-radius: 2px; }
.plain .slot { border-bottom-color: transparent; } .plain .slot b { display: none; }
.plain .sent { line-height: 1.6; }

/* Lesson */
.why { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.why b { color: var(--accent); }
.formula { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-family: var(--f-mono); font-size: 14px; display: grid; gap: 6px; overflow-x: auto; }
.formula div { white-space: pre; }
.ex { display: grid; gap: 14px; }
.ex .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px 10px; min-width: 0; }
.ex .th { font-size: 14px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--sunk); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.en, td .en { font-family: var(--f-display); }
td.mono { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.traps { display: grid; gap: 8px; }
.trap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.trap .w { color: var(--bad); text-decoration: line-through; font-family: var(--f-display); }
.trap .r { color: var(--ok); font-weight: 600; font-family: var(--f-display); }
.toggle { font-size: 13px; }

/* Questions */
.qs { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.q .head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.q .stem { font-family: var(--f-display); font-size: 17px; line-height: 1.6; }
.q .stem u { text-decoration: none; border-bottom: 2px solid var(--ink); position: relative; }
.q .stem u sup { font-family: var(--f-mono); font-size: 10px; color: var(--muted); margin-left: 2px; }
.blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--accent); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; text-align: left; font-family: var(--f-display); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.opt .L { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opt.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.exp { font-size: 14px; border-top: 1px dashed var(--line); padding-top: 8px; }
.exp a { color: var(--accent); }

/* Test & stats */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.big { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.testbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 4; background: var(--bg); padding-block: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--accent); }
.statrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 48px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.statrow:last-child { border-bottom: 0; }
.meter { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; max-width: 100%; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 18px; }
.toc ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.toc li button { border: 0; background: none; padding: 6px 0; text-align: left; width: 100%; display: grid; grid-template-columns: 40px 1fr; gap: 6px; font-size: 14px; color: var(--ink); min-height: 32px; }
.toc li button:hover { color: var(--accent); }
.tn { font-family: var(--f-mono); font-size: 13px; color: var(--accent); font-weight: 500; }
.chapter { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 12px; }
.chapter h2 { display: flex; gap: 10px; align-items: baseline; font-size: 21px; border-top: 2px solid var(--ink); padding-top: 12px; margin: 0; }
.chapter h2 .tn { font-size: 15px; }
[id^="set-"] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 70px); }
.para { margin: 0; max-width: 68ch; }
.para .en { font-weight: 600; }
.subh { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.tip b { color: var(--accent); margin-right: 4px; }
.poswrap { display: grid; gap: 10px; }
.posline { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 4px 6px; font-family: var(--f-display); font-size: 16px; }
.pw { display: inline-grid; justify-items: center; line-height: 1.3; }
.pw > span { border-bottom: 3px solid var(--c); padding: 0 1px; }
.pw b { font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--c); }
.pw.punct { margin-left: -4px; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
@media (max-width: 420px) { .bar .col { flex-wrap: nowrap; gap: 8px; } .logo { font-size: 17px; } .seg a { padding: 6px 8px; font-size: 13px; } .bar .theme-btn { width: 36px; height: 36px; } h1 { font-size: 24px; } }
.theme-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; }
.theme-btn svg { width: 19px; height: 19px; }
.theme-btn .ti-sun { display: none; }
.theme-btn[data-mode="dark"] .ti-sun { display: block; }
.theme-btn[data-mode="dark"] .ti-moon { display: none; }
</style>

<header class="bar gut">
  <div class="col">
    <p class="logo">Grammar<i>/</i>Lab</p>
    <nav class="seg" aria-label="เมนู">
      <a href="#lessons" data-tab="lessons">บทเรียน</a>
      <a href="#test" data-tab="test">ข้อสอบ</a>
      <a href="#stats" data-tab="stats">สถิติ</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="สลับโหมดสว่าง/มืด"><svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>
<main class="gut"><div class="col" id="view"></div></main>

<script>
/* ===== Content =====
   Annotated sentence: {S:...} {V:...} {O:...} {C:...} {A:...} {X:...}  (X = connector / clause marker)
   Question: ["fill", stem with ___, [4 options], answerIndex, explanation]
             ["err",  stem with [[segment]] x4, answerIndex, explanation]          */
const PARTS = [
  { id: "A", name: "Part A · โครงสร้างประโยค" },
  { id: "B", name: "Part B · กริยาและกาล" },
  { id: "C", name: "Part C · ประโยคซ้อนและคำเชื่อม" },
  { id: "D", name: "Part D · เปรียบเทียบ คำนำหน้านาม บุพบท" },
  { id: "E", name: "Part E · โครงสร้างขั้นสูง" },
];

const L = [
{ id: "word", part: "A", title: "Parts of Speech & Word Form", th: "ชนิดของคำและการเลือกรูปคำ",
  why: "<b>ออกบ่อยที่สุด</b> ใน TOEIC Part 5 และ CU-TEP ราว 1 ใน 3 ของข้อ grammar คือตัวเลือก 4 ตัวรากเดียวกัน (care / careful / carefully / carefulness) ให้เลือกตามตำแหน่งในประโยค บทนี้ฝึกให้ตอบได้แม้ไม่รู้ความหมายของคำ",
  book: [
    { h: "ทำไมรูปคำจึงสำคัญ",
      p: [
        "ภาษาไทยไม่เปลี่ยนรูปคำ คำว่า <b>ดี</b> ใช้ได้ทั้ง \"คนดี\" และ \"ทำงานดี\" แต่ภาษาอังกฤษเปลี่ยนรูปตามหน้าที่: a <span class=\"en\">good</span> nurse (adj) / she works <span class=\"en\">well</span> (adv) / the <span class=\"en\">goodness</span> (noun)",
        "ภาษาอังกฤษเรียงคำค่อนข้างตายตัว <b>ตำแหน่งจึงบอกหน้าที่</b> และหน้าที่บอกว่าต้องใช้คำชนิดไหน ข้อสอบรูปคำจึงเป็นข้อที่ทำได้เร็วที่สุด ถ้าจำตำแหน่งได้",
        "ตัวอย่าง: The ___ of the plan was delayed. ไม่ต้องรู้ว่าตัวเลือกแปลว่าอะไร เห็น <b>The ___ of</b> ก็รู้ว่าต้องเป็นนาม",
      ],
      tip: "ฝึกตั้งคำถามทุกข้อ: \"ช่องว่างนี้ทำหน้าที่อะไร\" ก่อนถามว่า \"คำนี้แปลว่าอะไร\"" },

    { h: "ชนิดของคำ 8 ชนิด",
      p: ["ข้อสอบรูปคำวนอยู่กับ 4 ชนิดหลักคือ <b>Noun, Verb, Adjective, Adverb</b> อีก 4 ชนิดเป็นคำบอกตำแหน่งที่ช่วยให้รู้ว่าช่องว่างต้องเป็นอะไร"],
      table: { head: ["ชนิด", "หน้าที่", "ตัวอย่าง"], rows: [
        ["Noun (N) นาม", "ชื่อคน สิ่งของ สถานที่ ความคิด", "nurse, budget, safety, decision"],
        ["Pronoun (Pro) สรรพนาม", "ใช้แทนนาม", "she, it, they, this, which"],
        ["Verb (V) กริยา", "การกระทำหรือสภาพ เป็นแกนของประโยค", "approve, is, has reviewed"],
        ["Adjective (Adj) คุณศัพท์", "ขยายนาม หรือเป็นส่วนเติมเต็มหลัง be", "new, effective, available"],
        ["Adverb (Adv) กริยาวิเศษณ์", "ขยายกริยา คุณศัพท์ adverb อื่น หรือทั้งประโยค", "carefully, very, recently, however"],
        ["Preposition (P) บุพบท", "วางหน้านามเพื่อบอกความสัมพันธ์", "in, on, for, during, despite"],
        ["Conjunction (Conj) สันธาน", "เชื่อมคำหรือประโยค", "and, but, because, although"],
        ["Determiner (D) คำนำหน้านาม", "บอกว่านามตัวไหน เท่าไร ของใคร", "a, the, this, my, each, some"],
      ]},
      pos: [
        "The/D new/Adj manager/N carefully/Adv reviewed/V the/D annual/Adj budget/N for/P our/D hospital/N ./-",
        "Unfortunately/Adv ,/- the/D results/N were/V not/Adv available/Adj because/Conj the/D system/N failed/V ./-",
      ] },

    { h: "Noun: คำนาม",

{ id: "cond", part: "C", title: "Conditionals", th: "ประโยคเงื่อนไข If และ Inversion",
  why: "<b>จับคู่ให้ถูก</b>: ดู tense ใน if-clause แล้วเลือก main clause ให้ตรงชนิด ข้อสอบระดับสูงชอบตัด if แล้วกลับประโยค (Should you..., Had I known...)",

    ["Had I known, ...", "If I had known (Type 3)", "Had we left earlier, we would have arrived."],
    ["unless", "if ... not", "Unless you hurry, you will be late."],
    ["provided (that) / as long as", "ก็ต่อเมื่อ", "You can go, provided that you finish."],

  ],
  traps: [

  qs: [

    ["fill", "If I ___ you, I would accept the job offer.", ["am", "was", "were", "be"], 2, "Type 2 สมมติ ภาษาทางการใช้ were กับทุกประธาน"],
    ["fill", "If they had left earlier, they ___ the train.", ["would catch", "will catch", "would have caught", "had caught"], 2, "If + had V3 → would have + V3"],

/* ===== Derived ===== */
const LESSON = Object.fromEntries(L.map(l => [l.id, l]));
const BANK = [];
function mkQ(q, id, lesson, set, noMock) { return { id, lesson, set, noMock: !!noMock, type: q[0], stem: q[1], opts: q[0] === "fill" ? q[2] : segs(q[1]), ans: q[0] === "fill" ? q[3] : q[2], exp: q[0] === "fill" ? q[4] : q[3] }; }
L.forEach(l => {
  if (l.sets) l.sets.forEach((st, si) => st.qs.forEach((q, i) => BANK.push(mkQ(q, l.id + "-s" + si + "-" + i, l.id, si, st.noMock))));
  else l.qs.forEach((q, i) => BANK.push(mkQ(q, l.id + "-" + i, l.id, 0, false)));
});
function segs(stem) { return [...stem.matchAll(/\[\[(.+?)\]\]/g)].map(m => m[1]); }

/* ===== Storage (per-viewer) ===== */
const KEY = "grammar-lab-v1";
let S = { ans: {}, tests: [], plain: false };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function record(qid, ok) { const a = S.ans[qid] || { n: 0, c: 0 }; a.n++; if (ok) a.c++; a.last = ok ? 1 : 0; S.ans[qid] = a; save(); }
function lessonStat(id) {
  let n = 0, c = 0, seen = 0, total = 0;
  BANK.filter(q => q.lesson === id).forEach(q => { total++; const a = S.ans[q.id]; if (a) { seen++; n += a.n; c += a.c; } });
  return { seen, total, pct: n ? Math.round(c / n * 100) : null };
}

/* ===== Rendering helpers ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SLOT = { S: "S", V: "V", O: "O", C: "C", A: "A", X: "+" };
function annotate(s) {
  return esc(s).replace(/\{([SVOCAX]):([^}]*)\}/g, (_, k, t) => `<span class="slot k-${k}"><b>${SLOT[k]}</b>${t}</span>`);
}
function stemHTML(q, filled) {
  if (q.type === "err") { let i = 0; return esc(q.stem).replace(/\[\[(.+?)\]\]/g, (_, t) => `<u>${t}<sup>${"ABCD"[i++]}</sup></u>`); }
  return esc(q.stem).replace("___", filled != null ? `<span class="blank" style="text-align:center">${esc(q.opts[filled])}</span>` : '<span class="blank" aria-label="ช่องว่าง">&nbsp;</span>');
}
function pillFor(st) {
  if (st.pct == null) return `<span class="pill">ยังไม่ทำ</span>`;
  return `<span class="pill ${st.pct >= 80 ? "good" : st.pct < 60 ? "weak" : ""}">${st.pct}%</span>`;
}
function qCard(q, idx, opts = {}) {
  const picked = opts.picked, reveal = opts.reveal;
  return `<div class="q" data-qid="${q.id}">
    <div class="head"><span>${opts.label || "ข้อ " + (idx + 1)} · ${q.type === "err" ? "หาจุดผิด" : "เติมคำ"}</span>${opts.showLesson ? `<a href="#lesson-${q.lesson}" style="color:inherit">${esc(LESSON[q.lesson].title)}</a>` : ""}</div>
    <div class="stem" lang="en">${stemHTML(q)}</div>
    <div class="opts">${q.opts.map((o, j) => {
      let cls = "opt";
      if (reveal) { if (j === q.ans) cls += " ok"; else if (j === picked) cls += " no"; }
      else if (j === picked) cls += " picked";
      return `<button class="${cls}" data-pick="${j}"${reveal ? " disabled" : ""}><span class="L">${"ABCD"[j]}</span><span lang="en">${esc(o)}</span></button>`;
    }).join("")}</div>
    ${reveal ? `<div class="exp"><b>${picked === q.ans ? "ถูก" : "เฉลย " + "ABCD"[q.ans]}</b> · ${esc(q.exp)}</div>` : ""}
  </div>`;
}

        ${pillFor(lessonStat(l.id))}</button>`; }).join("")}
    </div></div>`).join("")}`;
}

const POSC = { N: "S", Pro: "S", V: "V", Adj: "C", Adv: "A", P: "O", D: "X", Conj: "X" };
function posLine(str) {
  return `<div class="posline" lang="en">${str.split(" ").map(tok => { const k = tok.lastIndexOf("/"); const w = tok.slice(0, k), t = tok.slice(k + 1);
    return t === "-" ? `<span class="pw punct">${esc(w)}</span>` : `<span class="pw k-${POSC[t] || "X"}"><span>${esc(w)}</span><b>${esc(t)}</b></span>`; }).join("")}</div>`;
}
function tableHTML(t) {
  return `<div class="tbl-wrap"><table><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, j) => `<td${j === 0 ? ' class="en"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function trapsHTML(tr) {
  return `<div class="traps">${tr.map(t => `<div class="trap"><div lang="en"><span class="w">${esc(t[0])}</span> → <span class="r">${esc(t[1])}</span></div><div class="note">${esc(t[2])}</div></div>`).join("")}</div>`;

function exHTML(ex) {

}
function setsHTML(l) {

}

function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function newTest(n, scope) {
  let pool = BANK.filter(q => !q.noMock);
  if (scope === "weak") {
    const weakIds = L.filter(l => { const p = lessonStat(l.id).pct; return p == null || p < 80; }).map(l => l.id);
    pool = pool.filter(q => weakIds.includes(q.lesson) && !(S.ans[q.id] && S.ans[q.id].last === 1));
    if (pool.length < 5) pool = BANK.filter(q => !q.noMock);
  } else if (scope !== "all") pool = pool.filter(q => LESSON[q.lesson].part === scope);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  test = { qs: pool.slice(0, Math.min(n, pool.length)), picks: {}, start: Date.now(), done: false };
}
function viewTest() {
  if (!test) return `<h1>ข้อสอบจำลอง</h1>
    <p class="sub">สุ่มจากคลังข้อสอบ ${BANK.length} ข้อ ส่งแล้วได้เฉลยพร้อมคำอธิบาย และดูได้ว่าพลาดบทไหน · TOEIC Part 5 มีเวลาราว 20–30 วินาทีต่อข้อ</p>
    <div class="panel">
      <div class="row"><label for="tN" class="note">จำนวนข้อ</label>
        <select id="tN"><option value="10">10 ข้อ (~5 นาที)</option><option value="20" selected>20 ข้อ (~10 นาที)</option><option value="40">40 ข้อ (~20 นาที)</option></select></div>
      <div class="row"><label for="tScope" class="note">ขอบเขต</label>
        <select id="tScope"><option value="all">ทุกบท</option><option value="weak">เฉพาะบทที่ยังไม่ผ่าน</option>${PARTS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
      <div><button class="btn primary" id="startBtn">เริ่มทำข้อสอบ</button></div>
    </div>
    ${S.tests.length ? `<div class="block"><h2>ผลครั้งก่อน</h2><div class="panel" style="gap:0">${S.tests.slice(-5).reverse().map(t => `<div class="statrow"><span>${esc(t.date)} · ${t.n} ข้อ · ${esc(t.time)}</span><div class="meter"><i style="width:${t.pct}%;background:${t.pct >= 80 ? "var(--ok)" : t.pct < 60 ? "var(--bad)" : "var(--accent)"}"></i></div><span class="num">${t.pct}%</span></div>`).join("")}</div></div>` : ""}`;

  const n = test.qs.length, answered = Object.keys(test.picks).length;
  if (!test.done) return `<div class="testbar"><span>ตอบแล้ว ${answered}/${n}</span><div class="progress"><i style="width:${answered / n * 100}%"></i></div><span id="clock">${fmt(Date.now() - test.start)}</span></div>
    <div class="qs">${test.qs.map((q, i) => qCard(q, i, { picked: test.picks[q.id] })).join("")}</div>
    <div class="row" style="margin-top:16px;justify-content:space-between"><button class="btn" id="quitBtn">ยกเลิก</button>
      <button class="btn primary" id="submitBtn">${answered < n ? `ส่งคำตอบ (ยังเหลือ ${n - answered} ข้อ)` : "ส่งคำตอบ"}</button></div>`;

  const correct = test.qs.filter(q => test.picks[q.id] === q.ans).length, pct = Math.round(correct / n * 100);
  const byL = {};
  test.qs.forEach(q => { const b = byL[q.lesson] || (byL[q.lesson] = { n: 0, c: 0 }); b.n++; if (test.picks[q.id] === q.ans) b.c++; });
  const weak = Object.entries(byL).filter(([, b]) => b.c < b.n).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  return `<div class="panel">
      <div class="eyebrow">ผลสอบ</div>
      <div class="row" style="align-items:baseline;gap:14px"><span class="big">${correct}/${n}</span><span class="note">${pct}% · ใช้เวลา ${fmt(test.end - test.start)} · เฉลี่ย ${Math.round((test.end - test.start) / 1000 / n)} วินาที/ข้อ</span></div>
      ${weak.length ? `<div><h3>บทที่ควรทบทวน</h3><div class="row">${weak.map(([id, b]) => `<a class="btn" href="#lesson-${id}"><span lang="en">${esc(LESSON[id].title)}</span> <span class="pill weak">${b.c}/${b.n}</span></a>`).join("")}</div></div>` : `<p style="margin:0">ถูกทุกข้อ</p>`}
      <div class="row"><button class="btn primary" id="againBtn">ทำชุดใหม่</button><button class="btn" id="quitBtn">กลับหน้าตั้งค่า</button></div>
    </div>
    <h2 class="block">เฉลยทุกข้อ</h2>
    <div class="qs">${test.qs.map((q, i) => qCard(q, i, { picked: test.picks[q.id], reveal: true, showLesson: true })).join("")}</div>`;
}

function viewStats() {
  const tried = Object.keys(S.ans).length;
  const totals = Object.values(S.ans).reduce((a, x) => ({ n: a.n + x.n, c: a.c + x.c }), { n: 0, c: 0 });
  const rows = L.map(l => ({ l, st: lessonStat(l.id) }));
  const weakest = rows.filter(r => r.st.pct != null).sort((a, b) => a.st.pct - b.st.pct).slice(0, 3);
  return `<h1>สถิติ</h1><p class="sub">เก็บในเบราว์เซอร์นี้เท่านั้น นับทั้งข้อสอบท้ายบทและข้อสอบจำลอง</p>
    <div class="panel"><div class="row" style="gap:28px">
      <div><div class="big">${tried}<span class="note" style="font-size:16px">/${BANK.length}</span></div><div class="note">ข้อที่เคยทำ</div></div>
      <div><div class="big">${totals.n ? Math.round(totals.c / totals.n * 100) + "%" : "–"}</div><div class="note">ความแม่นยำรวม</div></div>
      <div><div class="big">${S.tests.length}</div><div class="note">ข้อสอบจำลองที่ทำ</div></div>
    </div>
    ${weakest.length ? `<div><h3>จุดอ่อน 3 อันดับแรก</h3><div class="row">${weakest.map(r => `<a class="btn" href="#lesson-${r.l.id}"><span lang="en">${esc(r.l.title)}</span> <span class="pill ${r.st.pct < 60 ? "weak" : ""}">${r.st.pct}%</span></a>`).join("")}</div></div>` : ""}
    </div>
    <div class="block"><h2>รายบท</h2><div class="panel" style="gap:0">
      ${rows.map(r => `<a class="statrow" href="#lesson-${r.l.id}" style="text-decoration:none;color:inherit"><span style="min-width:0"><span lang="en" class="en">${esc(r.l.title)}</span> <span class="note">${r.st.seen}/${r.st.total} ข้อ</span></span>
        <div class="meter"><i style="width:${r.st.pct || 0}%;background:${r.st.pct == null ? "transparent" : r.st.pct >= 80 ? "var(--ok)" : r.st.pct < 60 ? "var(--bad)" : "var(--accent)"}"></i></div>
        <span class="num">${r.st.pct == null ? "–" : r.st.pct + "%"}</span></a>`).join("")}
    </div></div>
    <div class="block"><button class="btn" id="resetBtn">${resetArmed ? "แตะอีกครั้งเพื่อยืนยันล้างสถิติ" : "ล้างสถิติทั้งหมด"}</button></div>`;
}
let resetArmed = false;

/* ===== Router ===== */
function parse() {
  const h = location.hash.slice(1);
  if (h.startsWith("lesson-") && LESSON[h.slice(7)]) return { tab: "lessons", lesson: h.slice(7) };
  if (h === "test" || h === "stats") return { tab: h, lesson: null };
  return { tab: "lessons", lesson: null };
}
function render(keepScroll) {
  const y = window.scrollY;
  document.querySelectorAll(".seg a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === route.tab ? "page" : "false"));
  $v.innerHTML = route.tab === "test" ? viewTest() : route.tab === "stats" ? viewStats() : route.lesson ? viewLesson(route.lesson) : viewLessons();
  if (keepScroll) window.scrollTo(0, y);
}
window.addEventListener("hashchange", () => { route = parse(); resetArmed = false; render(); window.scrollTo(0, 0); });

/* ===== Events ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.jump) { const t = document.getElementById(b.dataset.jump); if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  if (b.dataset.go) { location.hash = b.dataset.go; return; }
  if (b.dataset.pick != null) {
    const qid = b.closest(".q").dataset.qid, q = BANK.find(x => x.id === qid), pick = +b.dataset.pick;
    if (route.tab === "test" && test && !test.done) { test.picks[qid] = pick; render(true); return; }
    if (route.lesson && practiceState[qid] == null) { practiceState[qid] = pick; record(qid, pick === q.ans); render(true); }
    return;
  }
  switch (b.id) {
    case "plainBtn": S.plain = !S.plain; save(); render(true); break;
    case "redoBtn": BANK.filter(q => q.lesson === route.lesson && q.set === +(b.dataset.set || 0)).forEach(q => delete practiceState[q.id]); render(true); break;
    case "startBtn": newTest(+document.getElementById("tN").value, document.getElementById("tScope").value); render(); window.scrollTo(0, 0); break;
    case "submitBtn": {
      test.done = true; test.end = Date.now();
      test.qs.forEach(q => { if (test.picks[q.id] != null) record(q.id, test.picks[q.id] === q.ans); else record(q.id, false); });
      const c = test.qs.filter(q => test.picks[q.id] === q.ans).length;
      const d = new Date();
      S.tests.push({ date: d.getDate() + "/" + (d.getMonth() + 1), n: test.qs.length, pct: Math.round(c / test.qs.length * 100), time: fmt(test.end - test.start) });
      S.tests = S.tests.slice(-30); save(); render(); window.scrollTo(0, 0); break;
    }
    case "againBtn": newTest(test.qs.length, "all"); render(); window.scrollTo(0, 0); break;
    case "quitBtn": test = null; render(); window.scrollTo(0, 0); break;
    case "resetBtn":
      if (!resetArmed) { resetArmed = true; render(true); setTimeout(() => { if (resetArmed) { resetArmed = false; if (route.tab === "stats") render(true); } }, 4000); }
      else { S.ans = {}; S.tests = []; save(); resetArmed = false; practiceState = {}; render(true); }
      break;
  }
});
setInterval(() => { const c = document.getElementById("clock"); if (c && test && !test.done) c.textContent = fmt(Date.now() - test.start); }, 1000);

route = parse(); render();

/* Theme toggle: remembered per viewer; until used, the page follows the system / claude.ai theme */
(function () {
  const TK = "grammar-lab-v1-theme", root = document.documentElement, btn = document.getElementById("themeBtn");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const eff = () => root.dataset.theme || (mq.matches ? "dark" : "light");
  const paint = () => { const m = eff(); btn.dataset.mode = m; btn.setAttribute("aria-label", m === "dark" ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"); btn.title = btn.getAttribute("aria-label"); };
  try { const t = localStorage.getItem(TK); if (t === "light" || t === "dark") root.dataset.theme = t; } catch (e) {}
  btn.addEventListener("click", e => { e.stopPropagation(); const n = eff() === "dark" ? "light" : "dark"; root.dataset.theme = n; try { localStorage.setItem(TK, n); } catch (e2) {} paint(); });
  mq.addEventListener && mq.addEventListener("change", paint);
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  paint();
})();
</script>

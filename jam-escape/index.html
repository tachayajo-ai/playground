<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>หนีรถติด</title>
<style>
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --ink: #1E2430; --muted: #6A7180; --line: #DDD7CB;
  --board: #3A4150; --board-cell: #474F60; --board-edge: #2A303C;
  --accent: #D8382C; --accent-ink: #FFFFFF; --good: #1F8A5B; --gold: #E5A323;
  --chip: #EEE9DF; --shadow: 0 1px 2px rgba(30,36,48,.08), 0 6px 20px rgba(30,36,48,.08);
  --f: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171D; --surface: #1E222A; --ink: #EDEFF3; --muted: #9AA1AE; --line: #2E3440;
    --board: #2A303B; --board-cell: #353C49; --board-edge: #0E1116;
    --accent: #F0564A; --chip: #2A2F39; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171D; --surface: #1E222A; --ink: #EDEFF3; --muted: #9AA1AE; --line: #2E3440;
  --board: #2A303B; --board-cell: #353C49; --board-edge: #0E1116;
  --accent: #F0564A; --chip: #2A2F39; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 32px; }
header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
header.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.01em; }
header.top h1 span { color: var(--accent); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.iconbtn:focus-visible, .btn:focus-visible, .lv:focus-visible, .car:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ----- stats bar ----- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; text-align: center; }
.stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

/* ----- board ----- */
.boardwrap { position: relative; padding-right: 22px; }
.board { position: relative; width: 100%; aspect-ratio: 1; background: var(--board); border-radius: 18px; padding: var(--pad); box-shadow: inset 0 0 0 4px var(--board-edge), var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none; }
.grid { position: absolute; inset: var(--pad); display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 3px; }
.grid i { background: var(--board-cell); border-radius: 6px; }
.exit { position: absolute; right: -22px; width: 26px; display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 20px; }
.exit::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--board); }
.exit span { position: relative; }
.car { position: absolute; left: 0; top: 0; border: none; padding: 0; border-radius: 10px; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.25); touch-action: none; transition: transform .16s ease; display: grid; place-items: center; }
.car.drag { transition: none; z-index: 5; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.35); }
.car::after { content: ""; position: absolute; border-radius: 5px; background: rgba(255,255,255,.35); }
.car.h::after { top: 22%; bottom: 22%; right: 12%; width: 12%; }
.car.v::after { left: 22%; right: 22%; bottom: 12%; height: 12%; }
.car.red { background: var(--accent); }
.car.red::before { content: "➜"; color: #fff; font-size: calc(var(--cell) * .42); font-weight: 700; opacity: .9; }
.car.hint { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--gold), 0 2px 4px rgba(0,0,0,.25); } }
.ghost { position: absolute; left: 0; top: 0; border-radius: 10px; border: 3px dashed var(--gold); pointer-events: none; background: rgba(229,163,35,.15); }
.car.out { transition: transform .45s ease-in; }
@media (prefers-reduced-motion: reduce) { .car, .car.out { transition: none; } .car.hint { animation: none; outline: 4px solid var(--gold); } }

/* ----- controls ----- */
.controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 6px; font-size: 14px; display: grid; justify-items: center; gap: 2px; min-height: 58px; }
.btn .ic { font-size: 18px; line-height: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.msg { min-height: 24px; margin: 12px 2px 0; color: var(--muted); font-size: 14px; }
.msg b { color: var(--ink); }
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ----- level list ----- */
.tier { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.tier h2 { font-size: 16px; margin: 0; }
.tier small { color: var(--muted); }
.lvgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lv { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; }
.lv b { font-size: 18px; line-height: 1.2; }
.lv small { font-size: 11px; color: var(--gold); letter-spacing: 1px; min-height: 16px; }
.lv.done { border-color: var(--good); }
.random { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.intro b { color: var(--ink); }

/* ----- dialog ----- */
.overlay { position: fixed; inset: 0; background: rgba(10,12,16,.5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--surface); border-radius: 20px; padding: 20px; width: min(360px, 100%); text-align: center; box-shadow: var(--shadow); }
.dialog h2 { margin: 0 0 4px; font-size: 22px; }
.dialog .stars { font-size: 34px; color: var(--gold); letter-spacing: 4px; margin: 6px 0; }
.dialog .stars .off { color: var(--line); }
.dialog p { margin: 4px 0 14px; color: var(--muted); }
.dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="homeBtn" aria-label="กลับไปหน้าเลือกด่าน" hidden>←</button>
    <h1>หนี<span>รถติด</span></h1>
    <button class="iconbtn" id="themeBtn" aria-label="สลับธีมสว่าง/มืด"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dialog"></div></div>

<script>
/* ===== Engine: 6x6 sliding-vehicle puzzle =====
   Board string: 36 chars, row-major. "o" = empty, "x" = wall, "A" = red car (horizontal, exit row),
   other letters = vehicles. A move slides one vehicle any number of free cells along its axis. */
const N = 6, EXIT_ROW = 2;

function parseBoard(str) {
  const cells = {}, walls = [];
  for (let i = 0; i < 36; i++) {
    const ch = str[i];
    if (ch === "o" || ch === ".") continue;
    if (ch === "x") { walls.push(i); continue; }
    (cells[ch] = cells[ch] || []).push(i);
  }
  const ids = Object.keys(cells).sort((a, b) => (a === "A" ? -1 : b === "A" ? 1 : a < b ? -1 : 1));
  const cars = ids.map(id => {
    const c = cells[id].sort((a, b) => a - b), horiz = c.length > 1 && c[1] - c[0] === 1;
    return { id, len: c.length, horiz, fixed: horiz ? Math.floor(c[0] / N) : c[0] % N };
  });
  const pos = ids.map(id => { const c = cells[id][0]; return cars[ids.indexOf(id)].horiz ? c % N : Math.floor(c / N); });
  return { cars, walls, pos };
}

function cellsOf(car, p) { const out = []; for (let k = 0; k < car.len; k++) out.push(car.horiz ? car.fixed * N + p + k : (p + k) * N + car.fixed); return out; }

function occupancy(game, pos) {
  const g = new Int8Array(36).fill(-1);
  game.walls.forEach(w => (g[w] = 99));
  game.cars.forEach((car, i) => cellsOf(car, pos[i]).forEach(c => (g[c] = i)));
  return g;
}

/* Range [min,max] a car can slide to given the other cars */
function slideRange(game, pos, i, g) {
  g = g || occupancy(game, pos);
  const car = game.cars[i], at = (p) => (car.horiz ? car.fixed * N + p : p * N + car.fixed);
  let lo = pos[i], hi = pos[i];
  while (lo - 1 >= 0 && g[at(lo - 1)] === -1) lo--;
  while (hi + car.len < N && g[at(hi + car.len)] === -1) hi++;
  return [lo, hi];
}

function movesOf(game, pos) {
  const g = occupancy(game, pos), out = [];
  for (let i = 0; i < game.cars.length; i++) {
    const [lo, hi] = slideRange(game, pos, i, g);
    for (let p = lo; p <= hi; p++) if (p !== pos[i]) out.push([i, p]);
  }
  return out;
}

const keyOf = pos => { let k = 0; for (let i = pos.length - 1; i >= 0; i--) k = k * 5 + pos[i]; return k; };
const isSolved = (game, pos) => pos[0] === N - game.cars[0].len;

/* Shortest solution from pos: array of [carIndex, newPos], or null if unsolvable */
function solve(game, pos, limit) {
  limit = limit || 400000;
  const start = keyOf(pos);
  if (isSolved(game, pos)) return [];
  const prev = new Map([[start, null]]);
  let frontier = [pos.slice()];
  while (frontier.length) {
    const next = [];
    for (const s of frontier) {
      for (const [i, p] of movesOf(game, s)) {
        const t = s.slice(); t[i] = p;
        const k = keyOf(t);
        if (prev.has(k)) continue;
        prev.set(k, [keyOf(s), i, p]);
        if (isSolved(game, t)) {
          const path = []; let cur = k;
          while (prev.get(cur)) { const [pk, ci, cp] = prev.get(cur); path.push([ci, cp]); cur = pk; }
          return path.reverse();
        }
        if (prev.size > limit) return null;
        next.push(t);
      }
    }
    frontier = next;
  }
  return null;
}

function toBoard(game, pos) {
  const out = new Array(36).fill("o");
  game.walls.forEach(w => (out[w] = "x"));
  game.cars.forEach((car, i) => cellsOf(car, pos[i]).forEach(c => (out[c] = car.id)));
  return out.join("");
}

/* ===== Generator =====
   Place random vehicles, explore the whole reachable state graph, then pick the state whose
   shortest solution is `want` moves (or the farthest one when want is Infinity). */
function randomLayout(rng, nCars) {
  const g = new Array(36).fill("o"), letters = "BCDEFGHIJKLMNOPQRSTUVWXYZ";
  const free = cs => cs.every(c => g[c] === "o");
  const rc = Math.floor(rng() * 3); // red starts at col 0..2
  [0, 1].forEach(k => (g[EXIT_ROW * N + rc + k] = "A"));
  let li = 0, tries = 0;
  while (li < nCars && tries++ < 400) {
    const len = rng() < 0.27 ? 3 : 2, horiz = rng() < 0.5;
    if (horiz) {
      const r = Math.floor(rng() * N); if (r === EXIT_ROW) continue;
      const c = Math.floor(rng() * (N - len + 1)), cs = []; for (let k = 0; k < len; k++) cs.push(r * N + c + k);
      if (free(cs)) { cs.forEach(x => (g[x] = letters[li])); li++; }
    } else {
      const c = Math.floor(rng() * N), r = Math.floor(rng() * (N - len + 1)), cs = []; for (let k = 0; k < len; k++) cs.push((r + k) * N + c);
      if (free(cs)) { cs.forEach(x => (g[x] = letters[li])); li++; }
    }
  }
  return g.join("");
}

/* Returns {board, dist} or null. Distances measured over the full connected component. */
function generateFrom(layout, want, cap) {
  cap = cap || 120000;
  const game = parseBoard(layout);
  const seen = new Map(), states = [];
  const q = [game.pos.slice()]; seen.set(keyOf(game.pos), 0); states.push(game.pos.slice());
  for (let h = 0; h < q.length; h++) {
    for (const [i, p] of movesOf(game, q[h])) {
      const t = q[h].slice(); t[i] = p; const k = keyOf(t);
      if (seen.has(k)) continue;
      seen.set(k, states.length); states.push(t); q.push(t);
      if (states.length > cap) return null;
    }
  }
  /* multi-source BFS from solved states (moves are reversible) */
  const dist = new Int32Array(states.length).fill(-1);
  let front = [];
  states.forEach((s, idx) => { if (isSolved(game, s)) { dist[idx] = 0; front.push(idx); } });
  if (!front.length) return null;
  let d = 0, best = null;
  while (front.length) {
    const next = [];
    for (const idx of front) {
      for (const [i, p] of movesOf(game, states[idx])) {
        const t = states[idx].slice(); t[i] = p; const j = seen.get(keyOf(t));
        if (dist[j] !== -1) continue; dist[j] = d + 1; next.push(j);
      }
    }
    if (!next.length) break;
    d++; front = next;
    if (d === want) break;
  }
  if (want !== Infinity && d < want) return null;
  /* among states at distance d, prefer one where the red car is not at the far right already */
  const pick = front[Math.floor(front.length / 2)];
  /* every vehicle must matter: drop puzzles where removing a vehicle keeps the same length is costly,
     so only check that the red car is not already free */
  return { board: toBoard(game, states[pick]), dist: d };
}



/* Levels: b = board (36 chars, row-major), m = minimum moves (verified by BFS) */
const LEVELS = [{"b":"ooooooFDHHHGFDAAIGoDoEIoCCCEooJJJBBB","m":3},{"b":"oGGoJJBBFFoDoCoAADECooooEooHHHEIIooo","m":3},{"b":"EFoCooEFKCooAAKBooHDDBGGHooIIooJJooo","m":4},{"b":"BoooFFBGGGEoBAAoEIJHHDDIJCoooooCoooo","m":4},{"b":"HHooGGoJJBCDoAABCDEFooCoEFooooEFooII","m":5},{"b":"KooooJKoEoIJAAEGIBoFFGoBDCooHoDCooHo","m":5},{"b":"oBJJKooBLLKGMAAoHGMoEEHGNIDFooNIDFCC","m":6},{"b":"ooGHHHooGoDDEoAAoJEIoooJCIoooFCoBBoF","m":6},{"b":"DooHHHDoIICCAAooFBJJJoFBooGGGKoooEEK","m":7},{"b":"oKoooooKHEEoAAHoIooBBoIGCDDJJGCoFFoo","m":7},{"b":"ooMBBooEMooDLEAAoDLoIIoDCHJJKKCHFFGG","m":8},{"b":"CFFNNoCIIIJMCoAAJMLLBBBoEGooKHEGDDKH","m":8},{"b":"CFFNNoCIIIJMCoAAJMLLBBBHEGooKHEGDDKo","m":9},{"b":"KooGGGKLLEEEAAMooCIIMDDCoFoHJJoFoHBB","m":9},{"b":"oIIDDDoFFoKHAAooKHLooEEBLCCNNBMMGGJJ","m":10},{"b":"MoooHoMooBHoAACBGIFFCoGIDKKoLLDJJEEo","m":10},{"b":"ooIoooooIFBBoAAFDGooooDGoHEEDJoHCCCJ","m":11},{"b":"oKooIooKEEIGAAHooGBBHoooCDDJJoCoooFF","m":11},{"b":"BBMooDLEMooDLEAAoDIIooooCHJJKKCHFFGG","m":12},{"b":"ooBBoEooIIJEoAAGJEoFFGHHooKDDDooKCCC","m":12},{"b":"oooJoooCCJIoAAKJIoFBKDDDFBGooHEEGooH","m":13},{"b":"ooooooIIooFCBAAoFCBHHHFCBGDDEEoGoJJo","m":13},{"b":"ooDFJJMBDFLLMBAAKGNIEEKGNIooHGCCooHo","m":14},{"b":"GGGoFHEEooFHDAAoFKDoBooKoJBoIIoJoCCo","m":14},{"b":"ooELLLCoEBKKCAABoDCoooFDoIJJFDoIGGHH","m":15},{"b":"EoDDGGEoCHHoAACoJoooooJooFFFJooIIBBo","m":16},{"b":"oooooDooooIDAAooIKFCCCIKFoJHBBEEJHGG","m":16},{"b":"oGGooJoDLLLJoDAABHEEIoBHMMIoCCoKKKFF","m":17},{"b":"KKMMHBoNIIHBLNoAABLEEGooFooGJJFDDDCC","m":17},{"b":"EoHIIoEoHoDoAAooDFBBBoDFoCoKKooCGGJJ","m":18},{"b":"oooHooLooHoDLAAGJDoIIGJooKEECFoKBBCF","m":18},{"b":"oBDDHCoBMEHCAAMEJIGKKKJIGoLoooFFLooo","m":19},{"b":"EKKHLFEoIHLFAAIooCoMMooCDJGGGCDJoBBB","m":20},{"b":"FFMoooLoMJJJLAAHooCCoHGBIIKKGBDDEEoo","m":22},{"b":"JMMDooJooDGGAALooCooLHHCEEEBBFIIoKKF","m":24},{"b":"oooLLHDooJGHDAAJGBoooCGBFoICKKFoIEEo","m":26},{"b":"oBEEMMoBNIIFAANooFKLLGCJKHHGCJoooGDD","m":29},{"b":"oGGGBFoHHoBFAALEooNoLECCNJJKKMDDDIIM","m":31},{"b":"CHLLJJCHoMFoCAAMFoEEGoFoooGDDKoBBIIK","m":33},{"b":"HoFFFIHDDDBIAAoLBEGGMLBEooMKCCoooKJJ","m":37}];

/* ===== App ===== */
const TIERS = [
  { name: "มือใหม่", from: 0, to: 8 },
  { name: "ง่าย", from: 8, to: 16 },
  { name: "ปานกลาง", from: 16, to: 24 },
  { name: "ยาก", from: 24, to: 32 },
  { name: "โหด", from: 32, to: 40 },
];
const PALETTE = ["#3F7FD6", "#2BA59A", "#8C5BD6", "#E0912F", "#5F9E35", "#D6577F", "#2F9FD3", "#B88A2E", "#6C7BD9", "#C2683C", "#3D9970", "#A55DB8", "#4A8DA8", "#9C7A3C"];
const KEY = "jam-escape-v1";
let save = { best: {}, stars: {} };
try { const r = localStorage.getItem(KEY); if (r) save = Object.assign(save, JSON.parse(r)); } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

const $view = document.getElementById("view"), $overlay = document.getElementById("overlay"), $dialog = document.getElementById("dialog");
let S = null; // current play state

/* ----- theme ----- */
(function () {
  let t = null; try { t = localStorage.getItem(KEY + "-theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY + "-theme", next); } catch (e) {}
  };
})();
document.getElementById("homeBtn").onclick = () => showHome();

/* ===== Home ===== */
function starStr(n) { return n == null ? "" : "★".repeat(n) + "☆".repeat(3 - n); }
function showHome() {
  stopBot(); S = null;
  document.getElementById("homeBtn").hidden = true;
  const done = Object.keys(save.best).length;
  $view.innerHTML = `
    <div class="intro"><b>วิธีเล่น</b> ลากรถให้เลื่อนไปตามแนวของมัน (รถแนวนอนเลื่อนซ้าย-ขวา รถแนวตั้งเลื่อนขึ้น-ลง) เปิดทางให้<b>รถสีแดง</b>ออกทาง <b style="color:var(--accent)">➜</b> ด้านขวา ใช้ตาน้อยที่สุดเท่าที่ทำได้ ถ้าติด กด <b>คำใบ้</b> ให้บอทชี้ทาง</div>
    <p style="color:var(--muted);font-size:14px;margin:10px 2px 0">ผ่านแล้ว ${done}/${LEVELS.length} ด่าน · ★ ${Object.values(save.stars).reduce((a, b) => a + b, 0)}/${LEVELS.length * 3}</p>
    ${TIERS.map(t => `<div class="tier"><h2>${t.name}</h2><small>${LEVELS[t.from].m}–${LEVELS[t.to - 1].m} ตา</small></div>
      <div class="lvgrid">${LEVELS.slice(t.from, t.to).map((l, k) => { const i = t.from + k; return `<button class="lv${save.best[i] != null ? " done" : ""}" data-lv="${i}" aria-label="ด่าน ${i + 1}${save.stars[i] != null ? " ได้ " + save.stars[i] + " ดาว" : ""}"><b>${i + 1}</b><small>${starStr(save.stars[i])}</small></button>`; }).join("")}</div>`).join("")}
    <div class="tier"><h2>สุ่มด่านใหม่</h2><small>บอทสร้างกระดานใหม่ให้ทุกครั้ง</small></div>
    <div class="random">
      <button class="btn" data-rand="easy"><span class="ic">🙂</span>ง่าย</button>
      <button class="btn" data-rand="mid"><span class="ic">🤔</span>กลาง</button>
      <button class="btn" data-rand="hard"><span class="ic">🔥</span>ยาก</button>
    </div>`;
  $view.querySelectorAll("[data-lv]").forEach(b => (b.onclick = () => startLevel(+b.dataset.lv)));
  $view.querySelectorAll("[data-rand]").forEach(b => (b.onclick = () => startRandom(b.dataset.rand, b)));
}

/* ===== Random puzzle (generated in the browser) ===== */
const RAND = { easy: [5, 9], mid: [10, 15], hard: [16, 60] };
function startRandom(kind, btn) {
  const [lo, hi] = RAND[kind], t0 = Date.now();
  let best = null, a = Math.random() * 1e9 | 0;
  const rng = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = `<span class="ic">⏳</span>กำลังสร้าง…`;
  (function step() {
    const until = Date.now() + 120;
    while (Date.now() < until) {
      const r = generateFrom(randomLayout(rng, 10 + Math.floor(rng() * 4)), kind === "hard" ? Infinity : lo + Math.floor(rng() * (hi - lo + 1)), 60000);
      if (!r || r.dist < 3) continue;
      if (r.dist >= lo && r.dist <= hi) { best = r; break; }
      if (kind === "hard" && (!best || r.dist > best.dist)) best = r;
    }
    const enough = best && best.dist >= lo && best.dist <= hi;
    if (!enough && Date.now() - t0 < (kind === "hard" ? 7000 : 4000)) return setTimeout(step, 0);
    btn.disabled = false; btn.innerHTML = label;
    if (!best) return;
    startBoard(best.board, best.dist, -1, { easy: "สุ่ม · ง่าย", mid: "สุ่ม · กลาง", hard: "สุ่ม · ยาก" }[kind]);
  })();
}

/* ===== Play ===== */
function startLevel(i) { startBoard(LEVELS[i].b, LEVELS[i].m, i, "ด่าน " + (i + 1)); }
function startBoard(board, optimal, idx, title) {
  stopBot();
  const game = parseBoard(board);
  S = { board, game, pos: game.pos.slice(), hist: [], optimal, idx, title, hintUsed: false, botUsed: false, won: false, plan: null, showLeft: S ? S.showLeft : false };
  document.getElementById("homeBtn").hidden = false;
  $view.innerHTML = `
    <div class="stats">
      <div class="stat"><b id="stTitle" style="font-size:16px;line-height:1.9">${title}</b><small>${idx >= 0 ? TIERS.find(t => idx >= t.from && idx < t.to).name : "บอทสร้าง"}</small></div>
      <div class="stat"><b id="stMoves">0</b><small>ตาที่ใช้</small></div>
      <div class="stat"><b>${optimal}</b><small>ตาที่น้อยที่สุด</small></div>
    </div>
    <div class="boardwrap"><div class="board" id="board"><div class="grid">${"<i></i>".repeat(36)}</div><div class="exit" id="exit" aria-hidden="true"><span>➜</span></div></div></div>
    <div class="msg" id="msg" aria-live="polite">ลากรถเพื่อเปิดทางให้รถสีแดง</div>
    <div class="controls">
      <button class="btn" id="undoBtn"><span class="ic">↶</span>ย้อน</button>
      <button class="btn" id="resetBtn"><span class="ic">⟲</span>เริ่มใหม่</button>
      <button class="btn" id="hintBtn"><span class="ic">💡</span>คำใบ้</button>
      <button class="btn" id="botBtn"><span class="ic">🤖</span>บอทเล่น</button>
    </div>
    <label class="toggle"><input type="checkbox" id="leftChk"${S.showLeft ? " checked" : ""}> ให้บอทบอกว่ายังเหลืออีกกี่ตา</label>`;
  const $b = document.getElementById("board");
  S.cars = game.cars.map((car, i) => {
    const el = document.createElement("button");
    el.className = "car " + (car.horiz ? "h" : "v") + (i === 0 ? " red" : "");
    el.style.setProperty("--c", PALETTE[(i - 1 + PALETTE.length) % PALETTE.length]);
    el.setAttribute("aria-label", (i === 0 ? "รถสีแดง" : (car.len === 3 ? "รถบรรทุก " : "รถ ") + car.id) + (car.horiz ? " แนวนอน" : " แนวตั้ง") + " ใช้ลูกศรเลื่อน");
    el.dataset.i = i; $b.appendChild(el); bindDrag(el, i); return el;
  });
  game.walls.forEach(w => { const el = document.createElement("div"); el.className = "car"; el.style.setProperty("--c", "var(--board-edge)"); el.dataset.wall = w; $b.appendChild(el); });
  document.getElementById("undoBtn").onclick = undo;
  document.getElementById("resetBtn").onclick = () => { if (S.hist.length) { stopBot(); S.pos = game.pos.slice(); S.hist = []; S.plan = null; clearHint(); layout(); after(); } };
  document.getElementById("hintBtn").onclick = hint;
  document.getElementById("botBtn").onclick = () => (S.botTimer ? stopBot() : runBot());
  document.getElementById("leftChk").onchange = e => { S.showLeft = e.target.checked; after(); };
  layout(); after();
}

function cellPx() { const b = document.getElementById("board"); const pad = Math.round(b.clientWidth * 0.035); b.style.setProperty("--pad", pad + "px"); return { pad, cell: (b.clientWidth - pad * 2) / 6 }; }
function layout() {
  if (!S) return;
  const { pad, cell } = cellPx(), b = document.getElementById("board"), gap = 3;
  b.style.setProperty("--cell", cell + "px");
  S.cars.forEach((el, i) => {
    const car = S.game.cars[i], w = car.horiz ? cell * car.len : cell, h = car.horiz ? cell : cell * car.len;
    el.style.width = w - gap - 4 + "px"; el.style.height = h - gap - 4 + "px";
    el.style.transform = `translate(${xy(i, S.pos[i], cell, pad).join("px,")}px)`;
  });
  b.querySelectorAll("[data-wall]").forEach(el => { const w = +el.dataset.wall; el.style.width = el.style.height = cell - gap - 4 + "px"; el.style.transform = `translate(${pad + (w % 6) * cell + 2}px,${pad + Math.floor(w / 6) * cell + 2}px)`; });
  const ex = document.getElementById("exit"); ex.style.top = pad + EXIT_ROW * cell + "px"; ex.style.height = cell + "px";
  if (S.ghost) drawGhost();
}
function xy(i, p, cell, pad) { const car = S.game.cars[i]; return car.horiz ? [pad + p * cell + 2, pad + car.fixed * cell + 2] : [pad + car.fixed * cell + 2, pad + p * cell + 2]; }
window.addEventListener("resize", layout);

/* ----- input: drag ----- */
function bindDrag(el, i) {
  let st = null;
  el.addEventListener("pointerdown", e => {
    if (!S || S.won || S.botTimer) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.focus({ preventScroll: true });
    const { pad, cell } = cellPx(), [lo, hi] = slideRange(S.game, S.pos, i);
    st = { x: e.clientX, y: e.clientY, p0: S.pos[i], lo, hi, cell, pad, off: 0 };
    el.classList.add("drag");
  });
  el.addEventListener("pointermove", e => {
    if (!st) return;
    const car = S.game.cars[i], d = car.horiz ? e.clientX - st.x : e.clientY - st.y;
    st.off = Math.max((st.lo - st.p0) * st.cell, Math.min((st.hi - st.p0) * st.cell, d));
    const [x, y] = xy(i, st.p0, st.cell, st.pad);
    el.style.transform = car.horiz ? `translate(${x + st.off}px,${y}px)` : `translate(${x}px,${y + st.off}px)`;
  });
  const end = () => {
    if (!st) return;
    el.classList.remove("drag");
    const p = st.p0 + Math.round(st.off / st.cell); st = null;
    if (p !== S.pos[i]) move(i, p); else layout();
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => {
    if (!S || S.won || S.botTimer) return;
    const car = S.game.cars[i], dir = { ArrowLeft: car.horiz ? -1 : 0, ArrowRight: car.horiz ? 1 : 0, ArrowUp: car.horiz ? 0 : -1, ArrowDown: car.horiz ? 0 : 1 }[e.key];
    if (!dir) return; e.preventDefault();
    const [lo, hi] = slideRange(S.game, S.pos, i), p = S.pos[i] + dir;
    if (p < lo || p > hi) return;
    const last = S.hist[S.hist.length - 1];
    if (last && last.i === i && last.key) { S.pos[i] = p; last.to = p; if (last.to === last.from) S.hist.pop(); S.plan = null; clearHint(); layout(); after(); }
    else move(i, p, true);
  });
}

function move(i, p, viaKey) {
  const from = S.pos[i];
  S.pos[i] = p; S.hist.push({ i, from, to: p, key: !!viaKey });
  /* keep the bot's plan if the player followed it */
  if (S.plan && S.plan.length && S.plan[0][0] === i && S.plan[0][1] === p) S.plan.shift(); else S.plan = null;
  clearHint(); layout(); after();
}
function undo() {
  if (!S || S.won || S.botTimer || !S.hist.length) return;
  const h = S.hist.pop(); S.pos[h.i] = h.from; S.plan = null; clearHint(); layout(); after();
}

function after() {
  document.getElementById("stMoves").textContent = S.hist.length;
  document.getElementById("undoBtn").disabled = !S.hist.length || !!S.botTimer;
  if (isSolved(S.game, S.pos)) return win();
  if (S.showLeft) {
    const plan = getPlan();
    setMsg(plan ? `บอท: จากตรงนี้ยังต้องเดินอีกอย่างน้อย <b>${plan.length}</b> ตา` : "บอท: ตำแหน่งนี้ออกไม่ได้แล้ว ลองย้อนดู");
  } else if (!S.ghost) setMsg(S.hist.length ? "" : "ลากรถเพื่อเปิดทางให้รถสีแดง");
}
function setMsg(h) { document.getElementById("msg").innerHTML = h; }

/* ----- bot ----- */
function getPlan() { if (!S.plan) S.plan = solve(S.game, S.pos); return S.plan; }
function clearHint() { S.ghost = null; document.querySelectorAll(".ghost").forEach(g => g.remove()); document.querySelectorAll(".car.hint").forEach(c => c.classList.remove("hint")); }
function drawGhost() {
  document.querySelectorAll(".ghost").forEach(g => g.remove());
  const [i, p] = S.ghost, { pad, cell } = cellPx(), car = S.game.cars[i], g = document.createElement("div");
  g.className = "ghost"; const [x, y] = xy(i, p, cell, pad);
  g.style.width = (car.horiz ? cell * car.len : cell) - 7 + "px"; g.style.height = (car.horiz ? cell : cell * car.len) - 7 + "px";
  g.style.transform = `translate(${x}px,${y}px)`; document.getElementById("board").appendChild(g);
}
function hint() {
  if (!S || S.won || S.botTimer) return;
  setMsg("บอทกำลังคิด…");
  setTimeout(() => {
    const plan = getPlan();
    if (!plan) return setMsg("บอท: ตำแหน่งนี้ออกไม่ได้แล้ว กด <b>ย้อน</b> หรือ <b>เริ่มใหม่</b>");
    S.hintUsed = true; clearHint();
    const [i, p] = plan[0], car = S.game.cars[i], dir = p > S.pos[i] ? (car.horiz ? "ไปทางขวา" : "ลงล่าง") : (car.horiz ? "ไปทางซ้าย" : "ขึ้นบน");
    S.ghost = [i, p]; S.cars[i].classList.add("hint"); drawGhost();
    setMsg(`บอท: เลื่อน${i === 0 ? "รถสีแดง" : "รถที่กะพริบ"}${dir} ${Math.abs(p - S.pos[i])} ช่อง (ทางที่สั้นที่สุดยังเหลือ ${plan.length} ตา)`);
  }, 20);
}
function runBot() {
  if (!S || S.won) return;
  const plan = getPlan();
  if (!plan) return setMsg("บอท: ตำแหน่งนี้ออกไม่ได้แล้ว กด <b>ย้อน</b> หรือ <b>เริ่มใหม่</b>");
  S.botUsed = true; clearHint();
  const btn = document.getElementById("botBtn"); btn.innerHTML = `<span class="ic">⏹</span>หยุดบอท`;
  setMsg(`บอทกำลังเล่น… ใช้อีก ${plan.length} ตา`);
  const tick = () => {
    if (!S || S.won) return stopBot();
    const pl = getPlan(); if (!pl || !pl.length) return stopBot();
    const [i, p] = pl[0]; S.botTimer = 1; move(i, p);
    if (S && !S.won) S.botTimer = setTimeout(tick, 520);
  };
  S.botTimer = setTimeout(tick, 200);
  document.getElementById("undoBtn").disabled = true;
}
function stopBot() {
  if (!S || !S.botTimer) return;
  clearTimeout(S.botTimer); S.botTimer = null;
  const btn = document.getElementById("botBtn"); if (btn) btn.innerHTML = `<span class="ic">🤖</span>บอทเล่น`;
  if (!S.won) after();
}

/* ----- win ----- */
function win() {
  S.won = true; stopBot(); S.won = true; clearHint();
  const el = S.cars[0], { cell } = cellPx();
  el.classList.add("out"); el.style.transform += ` translateX(${cell * 3}px)`;
  const used = S.hist.length, m = S.optimal;
  const stars = S.botUsed ? 0 : Math.min(S.hintUsed ? 2 : 3, used <= m ? 3 : used <= m + Math.max(2, Math.round(m * 0.3)) ? 2 : 1);
  let newBest = false;
  if (S.idx >= 0 && !S.botUsed) {
    if (save.best[S.idx] == null || used < save.best[S.idx]) { save.best[S.idx] = used; newBest = true; }
    save.stars[S.idx] = Math.max(save.stars[S.idx] || 0, stars); persist();
  }
  setTimeout(() => {
    const nextIdx = S.idx >= 0 && S.idx + 1 < LEVELS.length ? S.idx + 1 : -1;
    $dialog.innerHTML = `<h2 id="dlgTitle">${S.botUsed ? "บอทพาออกได้แล้ว" : used <= m ? "สมบูรณ์แบบ!" : "ออกได้แล้ว!"}</h2>
      <div class="stars">${S.botUsed ? "🤖" : "★".repeat(stars) + `<span class="off">${"★".repeat(3 - stars)}</span>`}</div>
      <p>ใช้ ${used} ตา · ทางที่สั้นที่สุด ${m} ตา${S.hintUsed && !S.botUsed ? "<br>ใช้คำใบ้ ได้สูงสุด 2 ดาว" : ""}${S.botUsed ? "<br>ลองเล่นเองอีกรอบเพื่อเก็บดาว" : ""}${newBest && S.hist.length ? "<br>สถิติใหม่ของด่านนี้" : ""}</p>
      <div class="row"><button class="btn" id="dAgain"><span class="ic">⟲</span>เล่นอีกครั้ง</button>
      ${nextIdx >= 0 ? `<button class="btn primary" id="dNext"><span class="ic">➜</span>ด่านถัดไป</button>` : `<button class="btn primary" id="dHome"><span class="ic">☰</span>เลือกด่าน</button>`}</div>`;
    $overlay.hidden = false;
    const close = () => ($overlay.hidden = true);
    document.getElementById("dAgain").onclick = () => { close(); startBoard(S.board, S.optimal, S.idx, S.title); };
    const n = document.getElementById("dNext"); if (n) n.onclick = () => { close(); startLevel(nextIdx); };
    const h = document.getElementById("dHome"); if (h) h.onclick = () => { close(); showHome(); };
    (n || h).focus();
  }, 520);
}
$overlay.addEventListener("click", e => { if (e.target === $overlay) $overlay.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$overlay.hidden) $overlay.hidden = true; });

showHome();
</script>
</body>

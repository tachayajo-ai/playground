<style>
/* Layout: one-column phone app, routine timeline as the spine, bottom tab bar */
:root {
  --bg: #F3F7F6; --surface: #FFFFFF; --sunk: #E8EFED;
  --ink: #14302D; --muted: #587069; --line: #D7E2DF;
  --accent: #F2A531; --accent-ink: #3F2700; --accent-soft: #FCEBCB;
  --leaf: #2A7A67; --leaf-soft: #D9EFE8; --bad: #B9443A; --bad-soft: #F7DEDB;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1918; --surface: #162423; --sunk: #1D2E2C;
  --ink: #E6F0EE; --muted: #97ADA8; --line: #2A3D3A;
  --accent: #F5B84E; --accent-ink: #2A1A00; --accent-soft: #3A2C12;
  --leaf: #5CC2A8; --leaf-soft: #17352E; --bad: #F07D70; --bad-soft: #3B1F1C;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1918; --surface: #162423; --sunk: #1D2E2C;
  --ink: #E6F0EE; --muted: #97ADA8; --line: #2A3D3A;
  --accent: #F5B84E; --accent-ink: #2A1A00; --accent-soft: #3A2C12;
  --leaf: #5CC2A8; --leaf-soft: #17352E; --bad: #F07D70; --bad-soft: #3B1F1C;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.brand span { color: var(--accent); }
.streak { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Phrase card */
.en { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: -0.01em; }
.th { color: var(--muted); font-size: 14px; }
.kid { font-size: 13px; color: var(--leaf); display: flex; gap: 6px; align-items: baseline; }
.kid b { font-weight: 600; }

.hero { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 20px; display: grid; gap: 10px; }
.hero .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.hero .en { font-size: 28px; }
.hero .th { color: color-mix(in srgb, var(--bg) 78%, transparent); }
.hero .kid { color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; }
.hero .btn { background: transparent; border-color: color-mix(in srgb, var(--bg) 35%, transparent); color: var(--bg); }
.hero .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.icon { width: 18px; height: 18px; flex: none; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-block: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat .n { font-family: var(--f-display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--leaf); border-radius: 99px; }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 56px 1fr; gap: 12px; }
.tl .t { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); padding-top: 14px; text-align: right; position: relative; }
.tl .t.now { color: var(--accent-ink); }
.tl .t.now::before { content: "ตอนนี้"; display: block; font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 6px; width: max-content; margin-left: auto; margin-bottom: 2px; font-weight: 600; }
.scene { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 2px; min-width: 0; }
.scene .en { font-size: 17px; }
.scene .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.scene.is-now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.back { border: 0; background: none; color: var(--muted); padding: 0; margin-bottom: 12px; display: inline-flex; gap: 4px; align-items: center; font-size: 14px; min-height: 32px; }

.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; min-width: 0; }
.card.done { border-color: var(--leaf); }
.card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 12px; background: var(--sunk); color: var(--muted); border: 0; border-radius: 6px; padding: 2px 8px; }
button.tag:hover { color: var(--ink); }
.chk[aria-pressed="true"] { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); }

/* Grammar */
.lesson-item { width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.lesson-item .num { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.score { font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.score.good { background: var(--leaf-soft); color: var(--leaf); }
.pattern { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-family: var(--f-display); font-weight: 500; font-size: 15px; overflow-x: auto; }
.pattern div + div { margin-top: 4px; }
.section { display: grid; gap: 10px; margin-top: 22px; }
.mistake { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.wrong { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; }
.right { color: var(--leaf); font-weight: 600; }
.explain { font-size: 15px; }
.explain p { margin: 0 0 8px; }

.quiz { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.q .stem { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; text-align: left; font-family: var(--f-display); font-weight: 500; }
.opt.ok { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); }
.opt.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.why { font-size: 14px; color: var(--muted); }

/* Practice */
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
.flash .prompt { font-size: 22px; font-weight: 600; line-height: 1.4; }
.answer { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 6px; }
.heard { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.heard .w-ok { color: var(--leaf); font-weight: 600; }
.heard .w-miss { color: var(--bad); text-decoration: underline dotted; }
.mic.listening { background: var(--bad); border-color: var(--bad); color: #fff; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; max-width: 100%; }
.note { font-size: 13px; color: var(--muted); }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12px; }
nav.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
nav.tabs a[aria-current="page"] svg { color: var(--accent); }
nav.tabs svg { width: 22px; height: 22px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 14px; z-index: 6; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
.theme-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; }
.theme-btn svg { width: 19px; height: 19px; }
.theme-btn .ti-sun { display: none; }
.theme-btn[data-mode="dark"] .ti-sun { display: block; }
.theme-btn[data-mode="dark"] .ti-moon { display: none; }
header.top { align-items: center; }
</style>

/* ---------- Storage (per-viewer convenience) ---------- */
const KEY = "kiddo-talk-v1";

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function todayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function markActive() { const k = todayKey(); if (!S.days.includes(k)) { S.days.push(k); S.days = S.days.slice(-60); save(); } }
function streak() {
  let n = 0; const d = new Date();
  if (!S.days.includes(todayKey(d))) d.setDate(d.getDate() - 1);
  while (S.days.includes(todayKey(d))) { n++; d.setDate(d.getDate() - 1); }

}

/* ---------- Speech: Claude voice first, browser voice as fallback ---------- */
let tts = null, dict = null, dictBlocked = false;
const speakIcon = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';

let slow = false;
try { slow = localStorage.getItem(KEY + "-slow") === "1"; } catch (e) {}

function browserSpeak(text) {
  if (!("speechSynthesis" in window)) return toast("อุปกรณ์นี้ไม่รองรับการอ่านออกเสียง");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = slow ? 0.7 : 0.95;
  const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function say(text) {
  if (tts) {
    tts.speak(text, { language: "en", rate: slow ? 0.75 : 1 }).catch(err => {
      if (err && (err.code === "not_granted" || err.code === "unavailable")) { tts = null; browserSpeak(text); }
    });
  } else browserSpeak(text);
}
function sayDialog(parent, kid) {
  if (tts && kid) {
    tts.speak([{ text: parent, voice: "buttery", language: "en" }, { text: kid, voice: "airy", language: "en" }], { rate: slow ? 0.75 : 1 }).catch(() => {});
  } else say(kid ? parent + " ... " + kid : parent);
}

/* Listening: Claude dictation, else the browser's own recognizer */
const BrowserSR = window.SpeechRecognition || window.webkitSpeechRecognition;
function canListen() { return !dictBlocked && (dict || BrowserSR); }
function listen(onText, onState) {
  if (dict) {
    let finalText = "";
    const offs = [
      dict.onPartial(({ text }) => onText(finalText + " " + text, false)),
      dict.onFinal(({ text }) => { finalText += " " + text; onText(finalText, false); }),
      dict.onState(({ state, reason }) => {
        onState(state === "listening" || state === "starting");
        if (state === "idle") { offs.forEach(f => f()); onText(finalText, true); if (reason === "not_granted") { dictBlocked = true; toast("ไม่ได้รับอนุญาตใช้ไมค์ ใช้ปุ่มเฉลยแทนได้"); } }
      }),
    ];
    dict.start().catch(err => { offs.forEach(f => f()); onState(false); if (err && err.code === "not_granted") { dictBlocked = true; toast("ไม่ได้รับอนุญาตใช้ไมค์"); render(); } });
    return () => dict.stop().catch(() => {});
  }
  const r = new BrowserSR();
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = e => { const t = Array.from(e.results).map(x => x[0].transcript).join(" "); onText(t, false); };
  r.onstart = () => onState(true);
  r.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { dictBlocked = true; toast("เบราว์เซอร์นี้ใช้ไมค์ไม่ได้ ใช้ปุ่มเฉลยแทนได้"); render(); } };
  r.onend = () => { onState(false); onText(null, true); };
  try { r.start(); } catch (e) { onState(false); }
  return () => { try { r.stop(); } catch (e) {} };
}

/* Compare what was said with the target, word by word */
const norm = s => (s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' ]+/g, " ").split(/\s+/).filter(Boolean)
  .map(w => ({ "i'm": "i am", "it's": "it is", "you're": "you are", "we're": "we are", "don't": "do not", "can't": "can not", "i'll": "i will", "that's": "that is", "let's": "let us", "what's": "what is" }[w] || w)).join(" ").split(" ");
function compare(target, heard) {
  const t = norm(target), h = new Set(norm(heard));
  const words = target.split(/\s+/);
  let hit = 0;
  const marked = words.map(w => {
    const ok = norm(w).every(x => h.has(x));
    if (ok) hit++;
    return `<span class="${ok ? "w-ok" : "w-miss"}">${esc(w)}</span>`;
  });
  return { pct: Math.round(hit / words.length * 100), html: marked.join(" ") };
}

/* ---------- Helpers ---------- */

function toast(msg) {

  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200);
}
function nowScene() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  const timed = SCENES.filter(s => s.h >= 0);
  let cur = timed[timed.length - 1];
  for (const s of timed) if (h >= s.h - 0.25) cur = s;
  if (h < 5) cur = timed[timed.length - 1];
  return cur;
}
function phraseOfDay() {
  const d = new Date(); const seed = d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
  const pool = nowScene().items.map((_, i) => PHRASES.find(p => p.id === nowScene().id + "-" + i));
  return pool[seed % pool.length];
}

  if (d.dialog) { const p = PHRASES.find(x => x.id === d.dialog); sayDialog(p.en, p.kid); markActive(); return; }
  if (d.learn) {
    if (S.learned[d.learn]) delete S.learned[d.learn]; else { S.learned[d.learn] = Date.now(); markActive(); }
    save(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if ("scene" in d) { go("phrases", { scene: d.scene || null }); return; }
  if ("lesson" in d) { go("grammar", { lesson: d.lesson || null }); return; }
  if (b.id === "slowBtn") { slow = !slow; try { localStorage.setItem(KEY + "-slow", slow ? "1" : "0"); } catch (e) {} render(); toast(slow ? "อ่านออกเสียงช้าลง" : "อ่านออกเสียงความเร็วปกติ"); return; }

  // Quiz
  if (d.opt != null && b.classList.contains("opt")) {
    const qEl = b.closest(".q"); if (qEl.dataset.answered) return;
    const l = LESSON[route.lesson], qi = +qEl.dataset.q, q = l.quiz[qi], pick = +d.opt;
    qEl.dataset.answered = pick === q[2] ? "1" : "0";
    qEl.querySelectorAll(".opt").forEach((o, j) => { if (j === q[2]) o.classList.add("ok"); else if (j === pick) o.classList.add("no"); o.disabled = true; });
    const why = qEl.querySelector(".why"); why.hidden = false; why.textContent = (pick === q[2] ? "ถูก · " : "ยังไม่ถูก · ") + q[3];
    const all = [...document.querySelectorAll("#quiz .q")];
    if (all.every(x => x.dataset.answered)) {
      const pct = Math.round(all.filter(x => x.dataset.answered === "1").length / all.length * 100);
      const prev = S.quiz[l.id]; S.quiz[l.id] = { best: Math.max(pct, prev ? prev.best : 0), last: pct }; markActive(); save();
      document.getElementById("quizResult").textContent = "ได้ " + pct + "% · ดีที่สุด " + S.quiz[l.id].best + "%" + (pct >= 75 ? " ผ่านบทนี้แล้ว" : " ลองทวนจุดที่ผิดแล้วทำใหม่");
    }
    return;
  }
  if (b.id === "quizReset") { const y = window.scrollY; render(); window.scrollTo(0, y); return; }

  // Practice
  if (b.id === "revealBtn") { practice.revealed = !practice.revealed; if (practice.revealed) say(practice.deck[practice.i].en); render(); return; }
  if (b.id === "gotBtn" || b.id === "againBtn") {
    if (practice.stopFn) practice.stopFn();
    if (b.id === "gotBtn") { S.learned[practice.deck[practice.i].id] = S.learned[practice.deck[practice.i].id] || Date.now(); save(); }
    markActive();
    practice.i = (practice.i + 1) % practice.deck.length;
    Object.assign(practice, { revealed: false, heard: "", result: null, listening: false });
    render(); return;
  }
  if (b.id === "micBtn") {
    if (practice.listening && practice.stopFn) { practice.stopFn(); return; }
    const target = practice.deck[practice.i].en;
    practice.heard = ""; practice.result = null;
    practice.stopFn = listen((text, done) => {
      if (text != null) practice.heard = text.trim();
      if (done && practice.heard) { practice.result = compare(target, practice.heard); markActive(); }
      render();
    }, on => { practice.listening = on; render(); });
    return;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "deckSel") { buildDeck(e.target.value); render(); }
});

fromHash();

/* Light up Claude voice + dictation when the viewer offers them */
if (window.claude && window.claude.use) {
  window.claude.use("tts").then(t => { if (t) tts = t; }).catch(() => {});
  window.claude.use("dictation").then(d => { if (d) { dict = d; if (route.tab === "practice") render(); } }).catch(() => {});
}

/* Theme toggle: remembered per viewer; until used, the page follows the system / claude.ai theme */
(function () {
  const TK = "kiddo-talk-v1-theme", root = document.documentElement, btn = document.getElementById("themeBtn");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const eff = () => root.dataset.theme || (mq.matches ? "dark" : "light");
  const paint = () => { const m = eff(); btn.dataset.mode = m; btn.setAttribute("aria-label", m === "dark" ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"); btn.title = btn.getAttribute("aria-label"); };
  try { const t = localStorage.getItem(TK); if (t === "light" || t === "dark") root.dataset.theme = t; } catch (e) {}
  btn.addEventListener("click", e => { e.stopPropagation(); const n = eff() === "dark" ? "light" : "dark"; root.dataset.theme = n; try { localStorage.setItem(TK, n); } catch (e2) {} paint(); });
  mq.addEventListener && mq.addEventListener("change", paint);
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  paint();
})();
</script>

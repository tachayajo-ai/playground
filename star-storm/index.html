<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>พายุดารา</title>
<style>
/* 8-bit look: solid NES colours, hard edges, no blur */
:root {
  --bg: #000000; --ink: #FCFCFC; --muted: #BCBCBC; --frame: #FCFCFC; --blue: #0058F8; --red: #E40058; --gold: #F8B800; --orange: #E45C10;
  --f: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#stage { position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.corner { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; z-index: 3; }
.cb { width: 34px; height: 34px; border-radius: 0; border: 3px solid var(--frame); background: #000; color: var(--ink); font-size: 14px; font-weight: 900; display: grid; place-items: center; box-shadow: 3px 3px 0 var(--blue); }
.cb:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--blue); }
.ov { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; padding: 14px; background: repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0 2px, rgba(0,0,0,.35) 2px 4px); }
/* NES-style dialog box: white frame, black fill, blue outer step */
.card { width: min(330px, 100%); background: #000; border: 4px solid var(--frame); outline: 4px solid #000; box-shadow: 0 0 0 8px var(--blue); padding: 18px 16px; text-align: center; }
.logo { font-size: 38px; font-weight: 900; letter-spacing: .04em; margin: 0; color: var(--gold); text-shadow: 3px 0 0 #000, 3px 3px 0 var(--orange), 6px 6px 0 #A80020; line-height: 1.25; }
.sub { color: var(--muted); font-size: 14px; margin: 8px 0 14px; }
.card h2 { margin: 0 0 6px; font-size: 26px; color: var(--gold); text-shadow: 3px 3px 0 #A80020; }
.big { font-size: 36px; font-weight: 900; margin: 4px 0; color: var(--ink); text-shadow: 3px 3px 0 var(--blue); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.go { width: 100%; margin-top: 12px; border: 3px solid var(--frame); border-radius: 0; padding: 11px; font-size: 18px; font-weight: 900; color: #fff; background: var(--red); box-shadow: 4px 4px 0 #881400; letter-spacing: .02em; }
.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #881400; }
.go.alt { background: var(--blue); box-shadow: 4px 4px 0 #0000BC; }
.go.alt:active { box-shadow: 1px 1px 0 #0000BC; }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.help { text-align: left; font-size: 13px; color: var(--muted); line-height: 1.7; margin-top: 14px; border-top: 2px dashed #7C7C7C; padding-top: 10px; }
.help b { color: var(--gold); }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.items div { border: 2px solid #7C7C7C; padding: 6px 2px 4px; }
.items canvas { width: 30px; height: 30px; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
.stat { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="สนามรบในอวกาศ"></canvas>
    <div class="corner">
      <button class="cb" id="soundBtn" aria-label="เปิด/ปิดเสียง">♪</button>
      <button class="cb" id="pauseBtn" aria-label="หยุดเกม" hidden>II</button>
    </div>

    <div class="ov" id="menu">
      <div class="card">
        <h1 class="logo">พายุดารา</h1>
        <p class="sub">ด่าน 1 · ฝ่าฝูงเอเลี่ยน 5 ระลอก<br>แล้วโค่นยานแม่ยักษ์</p>
        <div class="items">
          <div><canvas data-icon="life" width="10" height="10"></canvas>เพิ่มชีวิต</div>
          <div><canvas data-icon="shield" width="10" height="10"></canvas>เพิ่มเกราะ</div>
          <div><canvas data-icon="power" width="10" height="10"></canvas>อัปพลังปืน</div>
        </div>
        <button class="go" id="startBtn"><span class="blink">▶</span> เริ่มภารกิจ</button>
        <div class="help">
          <b>มือถือ</b> แตะค้างตรงไหนก็ได้แล้วลาก ยานเลื่อนตามนิ้ว (นิ้วไม่บังยาน) ยิงอัตโนมัติ<br>
          <b>คีย์บอร์ด</b> ลูกศร / WASD · P หยุดเกม<br>
          <b>จุดโดน</b> คือจุดขาวกลางยานเท่านั้น
        </div>
        <p class="stat" id="hiText" style="margin-top:10px"></p>
      </div>
    </div>

    <div class="ov" id="pauseOv" hidden>
      <div class="card"><h2>พักเกม</h2><p class="stat" id="pauseScore"></p>
        <div class="row2"><button class="go alt" id="quitBtn">เมนู</button><button class="go" id="resumeBtn">เล่นต่อ</button></div></div>
    </div>

    <div class="ov" id="contOv" hidden>
      <div class="card"><h2>ยานถูกยิงตก</h2><p class="stat">เล่นต่อจากจุดเดิมไหม?</p>
        <div class="big" id="contNum" aria-live="polite">9</div>
        <p class="stat" id="contNote"></p>
        <div class="row2"><button class="go alt" id="giveUpBtn">ยอมแพ้</button><button class="go" id="contBtn"><span class="blink">▶</span> เล่นต่อ</button></div>
        <p class="stat" id="contLeft" style="margin-top:12px"></p></div>
    </div>

    <div class="ov" id="endOv" hidden>
      <div class="card"><h2 id="endTitle"></h2><div class="big" id="endScore"></div><p class="stat" id="endNote"></p>
        <div class="row2"><button class="go alt" id="menuBtn">เมนู</button><button class="go" id="againBtn">เล่นอีกครั้ง</button></div></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= Setup =================
   Game logic runs in a 360x640 world. Everything is drawn into a 180x320 "Famicom" buffer
   (1 pixel = 2 world units) and scaled up by a whole number with no smoothing. */
const W = 360, H = 640, LW = 180, LH = 320;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), $stage = document.getElementById("stage");
const lo = document.createElement("canvas"); lo.width = LW; lo.height = LH;
const g = lo.getContext("2d");
let scale = 1, dpr = 1, bgCanvas = null;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(Math.min(vw * dpr / LW, vh * dpr / LH)));   // integer upscale = crisp pixels
  cv.width = LW * k; cv.height = LH * k;
  const cssW = cv.width / dpr, cssH = cv.height / dpr;
  $stage.style.width = cssW + "px"; $stage.style.height = cssH + "px";
  scale = cssW / W;
}
window.addEventListener("resize", fit);
const KEY = "star-storm-v1";
let opt = { sound: true, hi: 0 };
try { Object.assign(opt, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const saveOpt = () => { try { localStorage.setItem(KEY, JSON.stringify(opt)); } catch (e) {} };
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const X = v => Math.round(v / 2);   // world -> pixel

/* NES-style colours */
const C = {
  black: "#000000", white: "#FCFCFC", lgray: "#BCBCBC", gray: "#7C7C7C", navy: "#0000BC", blue: "#0058F8", sky: "#3CBCFC", pale: "#A4E4FC",
  vio: "#4428BC", purple: "#6844FC", lav: "#9878F8", lilac: "#D8B8F8", mag: "#D800CC", plum: "#940084", pink: "#F878F8", rose: "#F85898",
  red: "#E40058", dred: "#A80020", orange: "#E45C10", lorange: "#FCA044", yellow: "#F8B800", lyellow: "#F8D878", brown: "#881400",
  green: "#00A800", lgreen: "#58D854", dgreen: "#005800", lime: "#B8F818", cyan: "#00E8D8",
};

/* ================= Sound: pulse/triangle/noise like the Famicom APU ================= */
let ac = null, pulse = {};
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      [0.125, 0.25, 0.5].forEach(d => {
        const n = 48, re = new Float32Array(n), im = new Float32Array(n);
        for (let i = 1; i < n; i++) re[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * d);
        pulse[d] = ac.createPeriodicWave(re, im);
      });
    } catch (e) {}
  }
  if (ac && ac.state === "suspended") ac.resume();
}
function osc(type, f, t, d, vol, slide, dest) {
  const o = ac.createOscillator(), gn = ac.createGain();
  if (type.startsWith("p")) o.setPeriodicWave(pulse[{ p12: 0.125, p25: 0.25, p50: 0.5 }[type]]); else o.type = type;
  o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  /* stepped envelope, the APU way */
  gn.gain.setValueAtTime(vol, t); gn.gain.setValueAtTime(vol * 0.6, t + d * 0.5); gn.gain.setValueAtTime(0.0001, t + d);
  o.connect(gn).connect(dest || ac.destination); o.start(t); o.stop(t + d + 0.02);
}
function tone(f, d, type, vol, slide, delay) { if (!opt.sound || !ac) return; osc(type || "p25", f, ac.currentTime + (delay || 0), d, vol || 0.06, slide); }
let noiseBuf = null;
function noise(d, vol, freq, t0, dest) {
  if (!opt.sound || !ac) return;
  if (!noiseBuf) { const n = ac.sampleRate, b = ac.createBuffer(1, n, n), a = b.getChannelData(0); let v = 0; for (let i = 0; i < n; i++) { if (i % 6 === 0) v = Math.random() * 2 - 1; a[i] = v; } noiseBuf = b; }
  const t = t0 || ac.currentTime, s = ac.createBufferSource(), gn = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = freq || 3000; s.buffer = noiseBuf;
  const steps = 6; for (let i = 0; i < steps; i++) gn.gain.setValueAtTime(vol * (1 - i / steps), t + d * i / steps); gn.gain.setValueAtTime(0.0001, t + d);
  s.connect(f).connect(gn).connect(dest || ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
}
let shotTick = 0;
const SFX = {
  shot: () => { if (++shotTick % 3 === 0) tone(1760, 0.04, "p12", 0.025, 880); },
  pop: () => { noise(0.2, 0.22, 2500); },
  boom: () => { noise(0.7, 0.4, 900); tone(110, 0.4, "triangle", 0.18, 40); },
  hit: () => { noise(0.3, 0.35, 4000); tone(440, 0.3, "p50", 0.06, 110); },
  shield: () => tone(880, 0.18, "p25", 0.06, 220),
  item: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.07, "p25", 0.06, null, i * 0.06)),
  warn: () => { for (let i = 0; i < 4; i++) { tone(660, 0.22, "p50", 0.05, null, i * 0.5); tone(440, 0.22, "p50", 0.05, null, i * 0.5 + 0.25); } },
  laser: () => tone(220, 0.8, "p12", 0.07, 55),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i === 5 ? 0.5 : 0.12, "p25", 0.07, null, i * 0.13)),
  lose: () => [392, 370, 349, 330].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.2, "p50", 0.06, null, i * 0.22)),
};

/* ----- original chiptune: stage + boss loops (MIDI note numbers, 0 = rest, one value per 8th note) ----- */
const SONGS = {
  stage: { bpm: 144,
    lead: [69,72,76,81, 79,76,72,74,  77,76,74,72, 74,0,72,0,  74,71,67,71, 74,79,77,76,  76,0,76,74, 72,71,68,71,
           69,72,76,81, 83,81,79,76,  77,79,81,77, 76,0,74,0,  74,76,77,79, 81,79,77,74,  76,0,0,0, 76,77,79,80],
    bass: [45,57,45,57, 45,57,45,57,  41,53,41,53, 41,53,41,53,  43,55,43,55, 43,55,43,55,  40,52,40,52, 40,52,40,52],
    drum: [1,0,2,0, 1,1,2,0] },
  boss: { bpm: 168,
    lead: [69,0,69,70, 69,0,64,0,  69,0,69,72, 71,70,69,0,  65,0,65,67, 65,0,60,0,  64,65,68,71, 74,71,68,64,
           81,0,81,82, 81,0,76,0,  81,0,84,83, 82,81,76,0,  77,0,77,79, 77,0,72,0,  76,77,80,83, 86,83,80,76],
    bass: [33,45,33,45, 33,45,34,46,  33,45,33,45, 33,45,32,44,  29,41,29,41, 29,41,29,41,  28,40,28,40, 28,40,31,43],
    drum: [1,2,1,2, 1,2,1,1] },
};
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const music = { song: null, step: 0, next: 0, timer: null, bus: null };
function playMusic(name) {
  stopMusic(); if (!ac) return;
  music.song = SONGS[name]; music.step = 0; music.next = ac.currentTime + 0.08;
  music.bus = ac.createGain(); music.bus.gain.value = opt.sound ? 1 : 0; music.bus.connect(ac.destination);
  music.timer = setInterval(scheduleMusic, 40);
}
function stopMusic() { if (music.timer) clearInterval(music.timer); music.timer = null; if (music.bus) { try { music.bus.gain.setValueAtTime(0, ac.currentTime); } catch (e) {} } music.song = null; }
function scheduleMusic() {
  const s = music.song; if (!s || !ac) return;
  const dt = 60 / s.bpm / 2;
  while (music.next < ac.currentTime + 0.25) {
    if (!paused) {
      const i = music.step, t = music.next, ln = s.lead[i % s.lead.length], bs = s.bass[i % s.bass.length], dr = s.drum[i % s.drum.length];
      if (ln) osc("p25", mtof(ln), t, dt * 0.9, 0.035, null, music.bus);
      if (ln && i % 2 === 0) osc("p12", mtof(ln + 12), t + dt * 0.5, dt * 0.4, 0.012, null, music.bus);   // echo voice
      if (bs) osc("triangle", mtof(bs), t, dt * 0.85, 0.12, null, music.bus);
      if (dr === 1) noise(0.05, 0.05, 6000, t, music.bus); else if (dr === 2) { noise(0.12, 0.09, 1500, t, music.bus); }
      music.step++;
    }
    music.next += dt;
  }
}

/* ================= Input ================= */
const keys = {};
window.addEventListener("keydown", e => {
  if (e.code === "KeyP" || e.code === "Escape") { if (game && game.state === "play") pauseGame(); return; }
  if (/Arrow|Key[WASD]/.test(e.code) && game && game.state === "play") e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", e => (keys[e.code] = false));
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (game && game.state === "play") pauseGame(); });
let drag = null;
cv.addEventListener("pointerdown", e => {
  audio(); if (!game || game.state !== "play") return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, px: e.clientX, py: e.clientY, sx: P.tx, sy: P.ty };
});
cv.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = 1.25 / scale;
  P.tx = clamp(drag.sx + (e.clientX - drag.px) * k, 16, W - 16); P.ty = clamp(drag.sy + (e.clientY - drag.py) * k, 70, H - 30);
  if (P.tx === 16 || P.tx === W - 16 || P.ty === 70 || P.ty === H - 30) drag = { id: drag.id, px: e.clientX, py: e.clientY, sx: P.tx, sy: P.ty };
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);

/* ================= Starfield + pixel background ================= */
const stars = [0, 1, 2].map(l => Array.from({ length: [40, 24, 12][l] }, () => ({ x: Math.random() * W, y: Math.random() * H, tw: Math.floor(Math.random() * 60) })));
function stepStars() { const boost = 1 + starBoost * 4 + (game && game.state === "clearing" ? 5 : 0); stars.forEach((L, l) => L.forEach(s => { s.y += [0.3, 0.7, 1.4][l] * boost; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } })); }
function pdisk(c, cx, cy, r, col) { c.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); c.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function buildBg() {
  const c = document.createElement("canvas"); c.width = LW; c.height = LH; const b = c.getContext("2d");
  b.fillStyle = C.black; b.fillRect(0, 0, LW, LH);
  /* dithered nebula blobs (checkerboard density falls off with distance) */
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  [[30, 70, 44, C.vio], [150, 190, 50, C.navy], [70, 290, 40, C.plum], [160, 40, 30, C.navy]].forEach(([x, y, r, col]) => {
    b.fillStyle = col;
    for (let py = y - r; py < y + r; py++) for (let px = x - r; px < x + r; px++) {
      const d = Math.hypot(px - x, py - y) / r; if (d > 1) continue;
      const dens = 1 - d;   // 0..1
      const pat = (px + py) % 2 === 0 ? 0.5 : 0.25;
      if ((dens > 0.55 && (px + py) % 2 === 0) || (dens > 0.25 && px % 2 === 0 && py % 2 === 0 && rnd() < 0.9) || (rnd() < dens * 0.08 * pat)) b.fillRect(px, py, 1, 1);
    }
  });
  /* ringed planet with dithered shading */
  const px = 148, py = 125, r = 15;
  b.fillStyle = C.lilac; const ring = (front) => { for (let a = 0; a < Math.PI * 2; a += 0.02) { const x = Math.round(px + Math.cos(a) * 26), y = Math.round(py + Math.sin(a) * 6 * 1 - Math.cos(a) * 3); if ((Math.sin(a) > 0) === front) b.fillRect(x, y, 1, 1); } };
  ring(false);
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); for (let dx = -w; dx <= w; dx++) {
    const l = (-dx - dy) / (r * 1.4);   // light from top-left
    let col = C.purple; if (l > 0.35) col = (l > 0.6 || (dx + dy) % 2 === 0) ? C.lav : C.purple; else if (l < -0.3) col = (l < -0.6 || (dx + dy) % 2 === 0) ? C.vio : C.purple;
    b.fillStyle = col; b.fillRect(px + dx, py + dy, 1, 1); } }
  b.fillStyle = C.lilac; ring(true);
  bgCanvas = c;
}

/* ================= Effects (pixel) ================= */
const booms = [];
const DEBRIS = { "#9BFF6A": [C.lgreen, C.green, C.white], "#FF6A9A": [C.pink, C.rose, C.white], "#FFB84F": [C.yellow, C.orange, C.white], "#FF5C7A": [C.red, C.rose, C.white], "#46E6FF": [C.sky, C.white, C.blue], "#FF7AD9": [C.pink, C.mag, C.white], "#FFD25A": [C.yellow, C.lyellow, C.white], "#FFFFFF": [C.white, C.yellow, C.lgray] };
function explode(x, y, s, col) {
  booms.push({ x, y, s, t: 0 });
  const cols = DEBRIS[col] || [C.yellow, C.orange, C.white];
  for (let i = 0; i < 14 * s; i++) { const a = rand(0, Math.PI * 2), v = rand(0.6, 4) * Math.sqrt(s); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(16, 34), max: 34, c: cols[i % cols.length], r: s > 1.5 && i % 3 === 0 ? 2 : 1, drag: 0.94 }); }
}
function spark(x, y, col) { const cols = DEBRIS[col] || [C.white, C.sky]; for (let i = 0; i < 3; i++) parts.push({ x, y, vx: rand(-2, 2), vy: rand(-2, 1), life: 8, max: 8, c: cols[i % cols.length], r: 1 }); }
function ring(x, y, c, r) { rings.push({ x, y, c: (DEBRIS[c] || [C.white])[0], r, t: 0, max: 20 }); }

/* ================= Entities ================= */
let game = null, P = null, T = 0;
const pb = [], eb = [], enemies = [], items = [], parts = [], rings = [], pops = [];
let shake = 0, flash = 0, banner = null, starBoost = 0;

function newGame() {
  booms.length = 0; pb.length = eb.length = enemies.length = items.length = parts.length = rings.length = pops.length = 0;
  P = { x: W / 2, y: H - 90, tx: W / 2, ty: H - 90, vx: 0, vy: 0, hp: 3, maxHp: 5, shield: 1, maxShield: 3, power: 1, inv: 90, fireT: 0, missT: 0, trail: [], alive: true, tilt: 0 };
  game = { state: "play", score: 0, wave: 0, queue: [], boss: null, waveT: 120, kills: 0, shots: 0, hits: 0, t: 0, dead: 0, laser: null, continues: 0, cont: 0 };
  showBanner("ด่าน 1", "เตรียมรับมือ!", 110);
}

const BANC = { "#46E6FF": [C.sky, C.blue], "#FF4F6A": [C.red, C.dred], "#FFD25A": [C.yellow, C.orange] };
function render() {
  if (!bgCanvas) buildBg();
  g.imageSmoothingEnabled = false;
  g.drawImage(bgCanvas, 0, 0);
  /* stars: 1px, twinkle by colour swap, streak when warping */
  const boost = 1 + starBoost * 4 + (game && game.state === "clearing" ? 5 : 0);
  stars.forEach((L, l) => L.forEach(s => { const tw = (T + s.tw) % 60 < 6; g.fillStyle = tw ? C.white : [C.gray, C.lgray, C.white][l]; g.fillRect(X(s.x), X(s.y), 1, 1 + (boost > 1 ? Math.round(l * boost * 0.6) : 0)); }));
  if (!game) { renderTitleShip(); return composite(0, 0); }
  items.forEach(drawItem);
  if (game.boss) drawBoss(game.boss);
  enemies.forEach(drawEnemy);
  /* boss laser */
  if (game.laser) {
    const L = game.laser, x = X(L.x), y0 = game.boss ? X(game.boss.y) + 20 : 0;
    if (L.t < 60) { if ((L.t >> 2) % 2 === 0) for (let y = y0; y < LH; y += 4) { g.fillStyle = C.red; g.fillRect(x, y, 1, 2); } ptext("! หลบ !", x, LH - 22, 10, C.red, "center", C.black); }
    else { const w = 5 + ((T >> 1) % 2); g.fillStyle = C.red; g.fillRect(x - w, y0, w * 2 + 1, LH); g.fillStyle = C.pink; g.fillRect(x - w + 2, y0, w * 2 - 3, LH); g.fillStyle = C.white; g.fillRect(x - 1, y0, 3, LH); }
  }
  /* player shots */
  pb.forEach(b => {
    const x = X(b.x), y = X(b.y);
    if (b.missile) { g.fillStyle = C.lgray; g.fillRect(x - 1, y - 2, 2, 4); g.fillStyle = T % 2 ? C.yellow : C.orange; g.fillRect(x - 1, y + 2, 2, 2); return; }
    if (b.w > 1) { g.fillStyle = C.sky; g.fillRect(x - 1, y - 4, 3, 8); g.fillStyle = C.white; g.fillRect(x, y - 4, 1, 8); }
    else { g.fillStyle = C.pale; g.fillRect(x - 1, y - 3, 2, 6); g.fillStyle = C.white; g.fillRect(x - 1, y - 3, 2, 2); }
  });
  drawPlayer();
  /* enemy shots: 2-frame colour cycle */
  eb.forEach(b => { const set = S.eb[b.col] || S.eb["#FF5FA2"]; spr(set[(T >> 2) % 2], X(b.x), X(b.y)); });
  drawBooms();
  parts.forEach(p => { if (p.life < 6 && T % 2) return; g.fillStyle = p.c; g.fillRect(X(p.x), X(p.y), p.r || 1, p.r || 1); });
  rings.forEach(r => pcircle(X(r.x), X(r.y), Math.round(r.r / 2 * (0.3 + r.t / r.max)), r.c, r.t > r.max / 2));
  pops.forEach(p => { if (p.t < 12 && T % 2) return; const c = POPC[p.c] || C.white; if (/^[+0-9]+$/.test(p.s)) digits(p.s, X(p.x), X(p.y) - 2, c, 1, C.black); else ptext(p.s, X(p.x), X(p.y), 11, c, "center", C.black); });
  /* low HP: blinking red frame */
  if (P.alive && P.hp === 1 && (T >> 4) % 2) { g.fillStyle = C.red; g.fillRect(0, 0, LW, 2); g.fillRect(0, LH - 2, LW, 2); g.fillRect(0, 0, 2, LH); g.fillRect(LW - 2, 0, 2, LH); }
  drawHUD();
  if (banner) {
    const k = banner.t / banner.max;
    if (!(k > 0.92 && T % 2) && !(k < 0.1 && T % 2)) {
      const [c1, c2] = BANC[banner.col] || [C.sky, C.blue], y = Math.round(LH * 0.4);
      g.fillStyle = C.black; g.fillRect(0, y - 18, LW, 36); g.fillStyle = c2; g.fillRect(0, y - 18, LW, 1); g.fillRect(0, y + 17, LW, 1);
      ptext(banner.a, LW / 2, y - 5, 16, c1, "center", c2);
      ptext(banner.b, LW / 2, y + 9, 11, C.white, "center");
    }
  }
  /* full-screen flash = whole palette goes white for a frame or two */
  if (flash > 0 && flash % 3 === 1) { if (!flashPat) { const c = document.createElement("canvas"); c.width = c.height = 2; const x = c.getContext("2d"); x.fillStyle = C.white; x.fillRect(0, 0, 1, 1); x.fillRect(1, 1, 1, 1); flashPat = g.createPattern(c, "repeat"); } g.fillStyle = flashPat; g.fillRect(0, 0, LW, LH); }
  composite(shake ? Math.round(rand(-shake, shake) / 2) : 0, shake ? Math.round(rand(-shake, shake) / 2) : 0);
}
function composite(ox, oy) {
  ctx.imageSmoothingEnabled = false;
  const k = cv.width / LW;
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(lo, ox * k, oy * k, cv.width, cv.height);
}
/* title screen: ship cruising */
const titleShip = { t: 0 };
function renderTitleShip() {
  titleShip.t++;
  const x = W / 2 + Math.sin(titleShip.t * 0.02) * 60, y = H - 140 + Math.sin(titleShip.t * 0.033) * 10;
  if (!P) P = { x, y, vx: 0, vy: -1, tilt: 0, trail: [], shield: 0, inv: 0, alive: true, hp: 3, maxHp: 5, maxShield: 3, power: 1 };
  P.vx = x - P.x; P.vy = -3; P.x = x; P.y = y; P.tilt = clamp(Math.cos(titleShip.t * 0.02) * 1.2, -1, 1);
  P.trail.push({ x, y, tilt: P.tilt }); if (P.trail.length > 7) P.trail.shift();
  drawPlayer();
}

/* ================= Loop & flow ================= */
let last = performance.now(), acc = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);   // schedule first: an error below can never stop the game loop
  const dt = Math.min(100, now - last); last = now;
  try {
    if (!paused) { acc += dt; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } }
    render();
  } catch (e) { acc = 0; console.error(e); }
}
const $menu = document.getElementById("menu"), $pause = document.getElementById("pauseOv"), $end = document.getElementById("endOv"), $pauseBtn = document.getElementById("pauseBtn");
function start() { audio(); $menu.hidden = true; $end.hidden = true; $cont.hidden = true; newGame(); $pauseBtn.hidden = false; playMusic("stage"); }
document.getElementById("startBtn").onclick = start;
document.getElementById("againBtn").onclick = start;
function toMenu() { stopMusic(); $cont.hidden = true; game = null; P = null; parts.length = 0; $end.hidden = true; $pause.hidden = true; paused = false; $pauseBtn.hidden = true; $menu.hidden = false; showHi(); }
document.getElementById("menuBtn").onclick = toMenu; document.getElementById("quitBtn").onclick = toMenu;
function pauseGame() { if (paused || !game || game.state !== "play") return; paused = true; document.getElementById("pauseScore").textContent = "คะแนน " + game.score; $pause.hidden = false; document.getElementById("resumeBtn").focus(); }
$pauseBtn.onclick = pauseGame;
document.getElementById("resumeBtn").onclick = () => { paused = false; $pause.hidden = true; last = performance.now(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });
/* ----- after death: 10-second CONTINUE countdown, up to 3 continues, respawn on the spot ----- */
const MAX_CONT = 3, $cont = document.getElementById("contOv");
function askContinue() {
  if (game.continues >= MAX_CONT) return endGame(false);
  game.state = "continue"; game.cont = 600; $pauseBtn.hidden = true; SFX.lose();
  const b = game.boss;
  document.getElementById("contNote").textContent = b ? `บอสเหลือพลังชีวิต ${Math.max(1, Math.round(b.hp / b.max * 100))}%${b.hp / b.max < 0.4 ? " อีกนิดเดียว!" : ""}` : game.bossIncoming ? "บอสกำลังมา" : `ระลอก ${Math.min(game.wave, WAVES.length)}/${WAVES.length}`;
  document.getElementById("contLeft").textContent = `เล่นต่อได้อีก ${MAX_CONT - game.continues} ครั้ง · กลับมาพร้อม ♥3 เกราะ 1 ชั้น`;
  document.getElementById("contNum").textContent = "9";
  $cont.hidden = false; document.getElementById("contBtn").focus();
}
function stepContinue() {
  stepStars();
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; if (--p.life <= 0) parts.splice(i, 1); }
  game.cont--;
  if (game.cont % 60 === 0) { const n = Math.floor(game.cont / 60); document.getElementById("contNum").textContent = n; if (n > 0) tone(n <= 3 ? 660 : 440, 0.08, "p25", 0.05); }
  if (game.cont <= 0) { $cont.hidden = true; endGame(false, true); }
}
function doContinue() {
  if (!game || game.state !== "continue") return;
  $cont.hidden = true; game.continues++;
  Object.assign(P, { hp: 3, shield: 1, power: Math.max(2, P.power), alive: true, x: W / 2, y: H - 40, tx: W / 2, ty: H - 120, vx: 0, vy: 0, inv: 200, trail: [], fireT: 20 });
  eb.length = 0; game.laser = null; game.state = "play"; flash = 0; shake = 0;
  ring(P.x, P.y, "#46E6FF", 60); ring(P.x, P.y, "#FFD25A", 40);
  showBanner("กลับมาสู้ต่อ!", `ใช้เล่นต่อแล้ว ${game.continues}/${MAX_CONT} ครั้ง`, 100, "#FFD25A");
  playMusic(game.boss || game.bossIncoming ? "boss" : "stage"); $pauseBtn.hidden = false;
}
document.getElementById("contBtn").onclick = doContinue;
document.getElementById("giveUpBtn").onclick = () => { if (game && game.state === "continue") { $cont.hidden = true; endGame(false, true); } };
function endGame(win, quiet) {
  game.state = "over"; $pauseBtn.hidden = true; stopMusic(); if (!win && !quiet) SFX.lose();
  if (win) game.score += P.hp * 2000 + P.shield * 1000;
  const newHi = game.score > opt.hi; if (newHi) { opt.hi = game.score; saveOpt(); }
  document.getElementById("endTitle").textContent = win ? "ภารกิจสำเร็จ! 🚀" : "ยานถูกยิงตก";
  document.getElementById("endScore").textContent = game.score.toLocaleString();
  document.getElementById("endNote").innerHTML = (win ? `โบนัสชีวิตและเกราะที่เหลือรวมแล้ว<br>` : `ถึงระลอก ${Math.min(game.wave, WAVES.length)}${game.boss || game.bossIncoming ? " (บอส)" : ""}<br>`) + `ยิงเอเลี่ยนตก ${game.kills} ตัว` + (game.continues ? ` · เล่นต่อ ${game.continues} ครั้ง` : "") + (newHi ? "<br><b style='color:#FFD25A'>สถิติใหม่!</b>" : "");
  $end.hidden = false; document.getElementById("againBtn").focus();
}
function showHi() { document.getElementById("hiText").textContent = opt.hi ? "คะแนนสูงสุด " + opt.hi.toLocaleString() : ""; }
document.getElementById("soundBtn").onclick = e => { opt.sound = !opt.sound; saveOpt(); e.currentTarget.textContent = opt.sound ? "♪" : "×"; e.currentTarget.style.color = opt.sound ? "" : "#7C7C7C"; if (opt.sound) audio(); if (music.bus) music.bus.gain.setValueAtTime(opt.sound ? 1 : 0, ac.currentTime); };
document.getElementById("soundBtn").textContent = opt.sound ? "♪" : "×";
FONT = getComputedStyle(document.body).fontFamily;
buildSprites();
document.querySelectorAll("[data-icon]").forEach(c => { const x = c.getContext("2d"); x.drawImage(S[c.dataset.icon], 0, 0); });
fit(); showHi(); requestAnimationFrame(frame);
</script>
</body>

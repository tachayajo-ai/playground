<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070814">
<title>พายุดารา</title>
<style>
:root {
  --bg: #05060F; --ink: #EAF2FF; --muted: #9AA6C4; --panel: rgba(14,18,40,.88); --line: rgba(120,200,255,.25);
  --cyan: #46E6FF; --pink: #FF4FA8; --gold: #FFD25A;
  --f: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#stage { position: relative; overflow: hidden; border-radius: 0; box-shadow: 0 0 60px rgba(70,230,255,.08); }
canvas { display: block; width: 100%; height: 100%; }
.corner { position: absolute; top: calc(6px + env(safe-area-inset-top)); right: 6px; display: flex; gap: 6px; z-index: 3; }
.cb { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10,14,30,.6); color: var(--ink); font-size: 15px; display: grid; place-items: center; }
.ov { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; padding: 16px; background: radial-gradient(ellipse at center, rgba(5,6,15,.35), rgba(5,6,15,.8)); }
.card { width: min(340px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; text-align: center; box-shadow: 0 0 40px rgba(70,230,255,.15); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.logo { font-size: 34px; font-weight: 800; letter-spacing: .02em; margin: 0; background: linear-gradient(90deg, #46E6FF, #B67CFF 55%, #FF4FA8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(70,230,255,.35)); }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
.card h2 { margin: 0 0 4px; font-size: 26px; }
.big { font-size: 38px; font-weight: 800; margin: 2px 0; color: var(--gold); text-shadow: 0 0 16px rgba(255,210,90,.4); }
.go { width: 100%; margin-top: 10px; border: none; border-radius: 14px; padding: 13px; font-size: 18px; font-weight: 800; color: #04121A; background: linear-gradient(180deg, #7CF1FF, #2FC4E6); box-shadow: 0 0 20px rgba(70,230,255,.45), 0 4px 0 #1A8BA6; }
.go:active { transform: translateY(2px); box-shadow: 0 0 20px rgba(70,230,255,.45), 0 2px 0 #1A8BA6; }
.go.alt { background: linear-gradient(180deg, #3A4470, #262D4E); color: var(--ink); box-shadow: 0 4px 0 #161B33; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.help { text-align: left; font-size: 13px; color: var(--muted); line-height: 1.7; margin-top: 12px; }
.help b { color: var(--ink); }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 2px; font-size: 12px; color: var(--muted); }
.items div { border: 1px solid var(--line); border-radius: 12px; padding: 6px 2px; }
.items b { display: block; font-size: 18px; }
.stat { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="สนามรบในอวกาศ"></canvas>
    <div class="corner">
      <button class="cb" id="soundBtn" aria-label="เปิด/ปิดเสียง">🔊</button>
      <button class="cb" id="pauseBtn" aria-label="หยุดเกม" hidden>❚❚</button>
    </div>

    <div class="ov" id="menu">
      <div class="card">
        <h1 class="logo">พายุดารา</h1>
        <p class="sub">ด่าน 1 · ฝ่าฝูงเอเลี่ยน 5 ระลอก แล้วโค่นยานแม่ยักษ์</p>
        <div class="items">
          <div><b style="color:#FF5C7A">♥</b>เพิ่มชีวิต</div>
          <div><b style="color:#46E6FF">⬢</b>เพิ่มเกราะ</div>
          <div><b style="color:#FFD25A">P</b>อัปพลังปืน</div>
        </div>
        <button class="go" id="startBtn">เริ่มภารกิจ</button>
        <div class="help">
          <b>มือถือ:</b> แตะค้างตรงไหนก็ได้แล้วลาก ยานจะเลื่อนตามนิ้ว (ไม่บังยาน) ยิงอัตโนมัติ<br>
          <b>คีย์บอร์ด:</b> ลูกศร / WASD บังคับยาน · P หยุดเกม<br>
          <b>จุดโดน</b> คือแกนสว่างกลางยานเท่านั้น หลบกระสุนเฉียดได้
        </div>
        <p class="stat" id="hiText" style="margin-top:10px"></p>
      </div>
    </div>

    <div class="ov" id="pauseOv" hidden>
      <div class="card"><h2>พักเกม</h2><p class="stat" id="pauseScore"></p>
        <div class="row2"><button class="go alt" id="quitBtn">เมนู</button><button class="go" id="resumeBtn">เล่นต่อ</button></div></div>
    </div>

    <div class="ov" id="endOv" hidden>
      <div class="card"><h2 id="endTitle"></h2><div class="big" id="endScore"></div><p class="stat" id="endNote"></p>
        <div class="row2"><button class="go alt" id="menuBtn">เมนู</button><button class="go" id="againBtn">เล่นอีกครั้ง</button></div></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= Setup ================= */
const W = 360, H = 640;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), $stage = document.getElementById("stage");
let scale = 1, dpr = 1, bgCanvas = null;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(vw, vh * W / H), h = w * H / W;
  $stage.style.width = w + "px"; $stage.style.height = h + "px";
  dpr = Math.min(window.devicePixelRatio || 1, 2); scale = w / W;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  bgCanvas = null;
}
window.addEventListener("resize", fit);
const KEY = "star-storm-v1";
let opt = { sound: true, hi: 0 };
try { Object.assign(opt, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const saveOpt = () => { try { localStorage.setItem(KEY, JSON.stringify(opt)); } catch (e) {} };
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= Sound ================= */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); }
function tone(f, d, type, vol, slide, delay) {
  if (!opt.sound || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol, freq) {
  if (!opt.sound || !ac) return;
  const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), a = buf.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = freq || 900; s.buffer = buf; g.gain.value = vol || 0.3;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
let shotTick = 0;
const SFX = {
  shot: () => { if (++shotTick % 3 === 0) tone(880, 0.05, "square", 0.025, 440); },
  pop: () => { noise(0.18, 0.22, 1200); tone(220, 0.12, "triangle", 0.06, 90); },
  boom: () => { noise(0.6, 0.5, 600); tone(110, 0.5, "sawtooth", 0.08, 40); },
  hit: () => { noise(0.25, 0.4, 2000); tone(300, 0.25, "square", 0.08, 80); },
  shield: () => tone(600, 0.2, "sine", 0.12, 300),
  item: () => [660, 880, 1320].forEach((f, i) => tone(f, 0.1, "triangle", 0.1, null, i * 0.06)),
  warn: () => { for (let i = 0; i < 3; i++) { tone(440, 0.28, "sawtooth", 0.06, null, i * 0.6); tone(330, 0.28, "sawtooth", 0.06, null, i * 0.6 + 0.3); } },
  laser: () => tone(140, 0.8, "sawtooth", 0.08, 70),
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.12, null, i * 0.12)),
};

/* ================= Input ================= */
const keys = {};
window.addEventListener("keydown", e => {
  if (e.code === "KeyP" || e.code === "Escape") { if (game && game.state === "play") pauseGame(); return; }
  if (/Arrow|Key[WASD]/.test(e.code) && game && game.state === "play") e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", e => (keys[e.code] = false));
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (game && game.state === "play") pauseGame(); });
let drag = null;
cv.addEventListener("pointerdown", e => {
  audio(); if (!game || game.state !== "play") return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, px: e.clientX, py: e.clientY, sx: P.tx, sy: P.ty };
});
cv.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = 1.25 / scale;
  P.tx = clamp(drag.sx + (e.clientX - drag.px) * k, 16, W - 16); P.ty = clamp(drag.sy + (e.clientY - drag.py) * k, 70, H - 30);
  /* re-anchor at the edges so the finger never "loses" the ship */
  if (P.tx === 16 || P.tx === W - 16 || P.ty === 70 || P.ty === H - 30) drag = { id: drag.id, px: e.clientX, py: e.clientY, sx: P.tx, sy: P.ty };
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);

/* ================= Background ================= */
const stars = [0, 1, 2].map(l => Array.from({ length: [60, 35, 18][l] }, () => ({ x: Math.random() * W, y: Math.random() * H, tw: Math.random() * 6 })));
function buildBg() {
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height;
  const g = c.getContext("2d"); g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#070818"); gr.addColorStop(0.5, "#0B0D26"); gr.addColorStop(1, "#05060F");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  [[70, 160, 180, "rgba(120,60,200,.28)"], [300, 380, 200, "rgba(30,120,200,.22)"], [150, 560, 160, "rgba(220,60,140,.16)"], [320, 90, 120, "rgba(40,200,220,.12)"]].forEach(([x, y, r, col]) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  });
  /* distant ringed planet */
  const px = 296, py = 250;
  g.save(); g.globalAlpha = 0.85;
  gr = g.createRadialGradient(px - 12, py - 12, 4, px, py, 34); gr.addColorStop(0, "#F1A9FF"); gr.addColorStop(0.6, "#7B47C8"); gr.addColorStop(1, "#2A1550");
  g.fillStyle = gr; g.beginPath(); g.arc(px, py, 30, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,200,255,.45)"; g.lineWidth = 3; g.beginPath(); g.ellipse(px, py, 52, 11, -0.35, 0, Math.PI * 2); g.stroke();
  g.restore();
  bgCanvas = c;
}

/* ================= Entities ================= */
let game = null, P = null, T = 0;
const pb = [], eb = [], enemies = [], items = [], parts = [], rings = [], pops = [];
let shake = 0, flash = 0, banner = null, starBoost = 0;

function newGame() {
  pb.length = eb.length = enemies.length = items.length = parts.length = rings.length = pops.length = 0;
  P = { x: W / 2, y: H - 90, tx: W / 2, ty: H - 90, vx: 0, vy: 0, hp: 3, maxHp: 5, shield: 1, maxShield: 3, power: 1, inv: 90, fireT: 0, missT: 0, trail: [], alive: true, tilt: 0 };
  game = { state: "play", score: 0, wave: 0, queue: [], boss: null, waveT: 120, kills: 0, shots: 0, hits: 0, t: 0, dead: 0, laser: null };
  showBanner("ด่าน 1", "เตรียมรับมือ!", 110);
}
function showBanner(a, b, t, col) { banner = { a, b, t, max: t, col: col || "#46E6FF" }; }

/* ----- waves ----- */
const SLOTS = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) SLOTS.push({ x: 55 + c * 50, y: 92 + r * 42 });
function drone(slot, from, delay) { game.queue.push({ at: game.t + delay, fn: () => enemies.push({ type: "drone", x: from.x, y: from.y, sx: from.x, sy: from.y, slot, hp: 5, max: 5, r: 13, t: 0, st: "enter", dur: 100, fireT: rand(60, 200), flash: 0, cx: from.cx, cy: from.cy, wave: game.wave }) }); }
function stinger(x, dir, delay) { game.queue.push({ at: game.t + delay, fn: () => enemies.push({ type: "stinger", x, y: -20, bx: x, hp: 3, max: 3, r: 11, t: 0, st: "zig", amp: rand(40, 80), dir, fireT: rand(40, 120), flash: 0, wave: game.wave }) }); }
function tank(x, ty, delay) { game.queue.push({ at: game.t + delay, fn: () => enemies.push({ type: "tank", x, y: -40, ty, hp: 40, max: 40, r: 22, t: 0, st: "enter", dir: Math.random() < 0.5 ? -1 : 1, fireT: 90, flash: 0, wave: game.wave }) }); }
const WAVES = [
  () => { for (let i = 0; i < 6; i++) drone(SLOTS[i], { x: -20, y: 140, cx: 200, cy: 380 }, i * 10); for (let i = 6; i < 12; i++) drone(SLOTS[i], { x: W + 20, y: 140, cx: 160, cy: 380 }, 80 + (i - 6) * 10); },
  () => { for (let i = 0; i < 5; i++) stinger(70, 1, i * 18); for (let i = 0; i < 5; i++) stinger(290, -1, 120 + i * 18); for (let i = 0; i < 6; i++) drone(SLOTS[6 + i], { x: 180, y: -30, cx: i < 3 ? -60 : 420, cy: 260 }, 220 + i * 12); },
  () => { tank(110, 150, 0); tank(250, 190, 60); for (let i = 0; i < 6; i++) drone(SLOTS[i], { x: i % 2 ? W + 20 : -20, y: 60, cx: 180, cy: 420 }, 100 + i * 14); for (let i = 0; i < 4; i++) stinger(rand(60, 300), i % 2 ? 1 : -1, 260 + i * 40); },
  () => { for (let i = 0; i < 12; i++) drone(SLOTS[i + (i >= 6 ? 6 : 0)], { x: i < 6 ? -20 : W + 20, y: 200, cx: 180, cy: 40 }, i * 9); tank(180, 210, 160); for (let i = 0; i < 8; i++) stinger(i % 2 ? 60 : 300, i % 2 ? 1 : -1, 220 + i * 25); },
  () => { for (let i = 0; i < 14; i++) stinger(rand(40, 320), Math.random() < 0.5 ? -1 : 1, i * 22); tank(90, 140, 120); tank(270, 140, 120); for (let i = 0; i < 6; i++) drone(SLOTS[12 + i], { x: 180, y: -30, cx: i < 3 ? 420 : -60, cy: 300 }, 200 + i * 12); },
];
function nextWave() {
  game.wave++;
  if (game.wave <= WAVES.length) { showBanner(`ระลอก ${game.wave}/${WAVES.length}`, ["ฝูงแรกมาแล้ว", "ระวังตัวพุ่ง!", "ยานหุ้มเกราะ", "ฝูงใหญ่", "ด่านสุดท้ายก่อนบอส"][game.wave - 1], 90); WAVES[game.wave - 1](); }
  else { showBanner("⚠ คำเตือน ⚠", "ยานแม่เอเลี่ยนกำลังเข้ามา", 170, "#FF4F6A"); SFX.warn(); starBoost = 1; game.queue.push({ at: game.t + 170, fn: spawnBoss }); game.bossIncoming = true; }
}

/* ----- boss ----- */
function spawnBoss() {
  game.boss = { x: W / 2, y: -140, hp: 4200, max: 4200, t: 0, phase: 1, flash: 0, fireT: 0, dir: 1, spiral: 0, dying: 0, summonT: 200, entered: false };
}
function bossPhase(b) { const f = b.hp / b.max; return f > 0.66 ? 1 : f > 0.33 ? 2 : 3; }
function stepBoss(b) {
  b.t++;
  if (b.dying) {
    b.dying++; b.y += 0.25;
    if (b.dying % 6 === 0) { explode(b.x + rand(-80, 80), b.y + rand(-40, 50), 1.2, b.dying % 12 ? "#FF7AD9" : "#FFD25A"); SFX.pop(); shake = 6; }
    if (b.dying === 120) { explode(b.x, b.y, 4, "#FFFFFF"); flash = 18; shake = 16; SFX.boom(); game.score += 10000; pops.push({ x: b.x, y: b.y, s: "+10000", t: 90, c: "#FFD25A" }); }
    if (b.dying > 125) { game.boss = null; eb.length = 0; game.state = "clearing"; game.clearT = 150; showBanner("ภารกิจสำเร็จ!", "โค่นยานแม่ได้แล้ว", 150, "#FFD25A"); SFX.win(); }
    return;
  }
  if (!b.entered) { b.y += 1.2; if (b.y >= 130) { b.entered = true; starBoost = 0; } return; }
  if (P.alive && ((P.x - b.x) / 92) ** 2 + ((P.y - b.y) / 52) ** 2 < 1) hurtPlayer();
  const ph = bossPhase(b);
  if (ph !== b.phase) { b.phase = ph; showBanner(ph === 2 ? "ยานแม่โกรธแล้ว!" : "ยานแม่คลั่ง!", ph === 2 ? "เรียกลูกสมุนมาช่วย" : "กระสุนเกลียว + เลเซอร์", 90, "#FF4F6A"); shake = 10; ring(b.x, b.y, "#FF4F6A", 140); }
  b.x += b.dir * (ph === 3 ? 1.1 : 0.7); if (b.x < 110 || b.x > W - 110) b.dir *= -1;
  b.y = 130 + Math.sin(b.t * 0.02) * 12;
  const aim = (x, y) => Math.atan2(P.y - y, P.x - x);
  b.fireT--;
  if (ph === 1) {
    if (b.fireT <= 0) { b.fireT = 75; for (let i = -4; i <= 4; i++) shoot(b.x, b.y + 40, Math.PI / 2 + i * 0.16, 2.6, "#FF5FA2"); }
    if (b.t % 150 === 75) for (const s of [-1, 1]) { const tx = b.x + s * 70, ty = b.y + 50; for (let k = 0; k < 3; k++) game.queue.push({ at: game.t + k * 8, fn: () => shoot(tx, ty, aim(tx, ty), 3.4, "#FFB84F") }); }
  } else if (ph === 2) {
    if (b.fireT <= 0) { b.fireT = 70; const o = b.t * 0.05; for (let i = 0; i < 16; i++) shoot(b.x, b.y, o + i * Math.PI / 8, 2.3, "#B67CFF"); }
    if (b.t % 100 === 50) for (const s of [-1, 1]) { const tx = b.x + s * 70, ty = b.y + 50; shoot(tx, ty, aim(tx, ty), 3.6, "#FFB84F"); }
    if (--b.summonT <= 0) { b.summonT = 260; for (let i = 0; i < 3; i++) enemies.push({ type: "stinger", x: b.x + (i - 1) * 50, y: b.y + 30, bx: b.x + (i - 1) * 50, hp: 2, max: 2, r: 11, t: 0, st: "zig", amp: 50, dir: i % 2 ? 1 : -1, fireT: 60, flash: 0, minion: true }); }
  } else {
    if (b.t % 6 === 0) { b.spiral += 0.27; for (let k = 0; k < 2; k++) shoot(b.x, b.y + 10, b.spiral + k * Math.PI, 2.4, k ? "#FF5FA2" : "#46E6FF"); }
    if (b.fireT <= 0) { b.fireT = 320; game.laser = { x: P.x, t: 0 }; }
    if (b.t % 90 === 0) for (let i = -2; i <= 2; i++) shoot(b.x, b.y + 40, aim(b.x, b.y + 40) + i * 0.12, 3.2, "#FFB84F");
  }
}

/* ----- shooting ----- */
function shoot(x, y, a, sp, col, r) { eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: r || 4.5, col }); }
function playerFire() {
  const lv = P.power, y = P.y - 20, B = (dx, a, dmg, w) => pb.push({ x: P.x + dx, y, vx: Math.sin(a) * 11, vy: -Math.cos(a) * 11, dmg: dmg || 1, w: w || 1 });
  if (lv === 1) B(0, 0);
  else if (lv === 2) { B(-6, 0); B(6, 0); }
  else if (lv === 3) { B(-6, 0); B(6, 0); B(-10, -0.14); B(10, 0.14); }
  else if (lv === 4) { B(-5, 0, 1.2); B(5, 0, 1.2); B(0, 0, 1.2); B(-12, -0.18); B(12, 0.18); }
  else { B(-6, 0, 1.5, 1.6); B(6, 0, 1.5, 1.6); B(0, -0.06); B(0, 0.06); B(-12, -0.2); B(12, 0.2); B(-14, -0.34); B(14, 0.34); }
  game.shots++; SFX.shot();

function drawBoss(b) {

function drawItem(it) {
  const I = ITEM[it.kind], bob = Math.sin(it.t * 0.1) * 2;

function heart(x, y, s, fill) {

}
function drawHUD() {
  if (!game) return;

  for (let i = 0; i < P.maxShield; i++) { const x = 16 + i * 16, y = top + 24; ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; k ? ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6) : ctx.moveTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); } ctx.closePath(); if (i < P.shield) { ctx.fillStyle = "#46E6FF"; glow("#46E6FF", 6); ctx.fill(); noGlow(); } else { ctx.strokeStyle = "rgba(70,230,255,.4)"; ctx.lineWidth = 1.2; ctx.stroke(); } }

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!bgCanvas) buildBg();
  ctx.drawImage(bgCanvas, 0, 0);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, sx * scale * dpr, sy * scale * dpr);
  /* stars */
  const boost = 1 + starBoost * 4 + (game && game.state === "clearing" ? 5 : 0);
  stars.forEach((L, l) => { ctx.fillStyle = ["rgba(160,180,255,.5)", "rgba(200,220,255,.75)", "#FFFFFF"][l]; L.forEach(s => { const tw = 0.6 + Math.sin(T * 0.05 + s.tw) * 0.4; ctx.globalAlpha = tw; const len = l * boost * 1.4; ctx.fillRect(s.x, s.y, l + 1 > 2 ? 1.6 : 1, (l + 1 > 2 ? 1.6 : 1) + len); }); });
  ctx.globalAlpha = 1;
  if (!game) { renderTitleShip(); return; }
  items.forEach(drawItem);
  if (game.boss) drawBoss(game.boss);
  enemies.forEach(drawEnemy);
  /* laser */
  if (game.laser) {
    const L = game.laser, y0 = game.boss ? game.boss.y + 40 : 0;
    if (L.t < 60) { ctx.strokeStyle = `rgba(255,79,106,${0.25 + (L.t % 10 < 5 ? 0.35 : 0)})`; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L.x, y0); ctx.lineTo(L.x, H); ctx.stroke(); ctx.setLineDash([]); ctx.font = `800 11px ${FONT}`; ctx.fillStyle = "#FF4F6A"; ctx.textAlign = "center"; ctx.fillText("⚠ หลบ!", L.x, H - 40); }

    if (b.missile) { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2); ctx.fillStyle = "#FFD9A0"; ctx.fillRect(-1.6, -5, 3.2, 10); ctx.fillStyle = "#FF8A3D"; ctx.beginPath(); ctx.arc(0, 6, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); return; }

/* title screen: ship cruising */
const titleShip = { t: 0 };
function renderTitleShip() {
  titleShip.t++;
  const x = W / 2 + Math.sin(titleShip.t * 0.02) * 60, y = H - 140 + Math.sin(titleShip.t * 0.033) * 10;
  const vx = Math.cos(titleShip.t * 0.02) * 1.2;
  if (!P) P = { x, y, vx, vy: -1, tilt: 0, trail: [], shield: 0, inv: 0, alive: true, hp: 3, maxHp: 5, maxShield: 3, power: 1 };
  P.vx = x - P.x; P.vy = y - P.y; P.x = x; P.y = y; P.tilt += (clamp(vx / 1.2, -1, 1) * 0.8 - P.tilt) * 0.1;

  for (const s of [-1, 1]) parts.push({ x: x + s * 7, y: y + 17, vx: rand(-0.3, 0.3), vy: rand(2, 3.5), life: 18, max: 18, c: Math.random() < 0.5 ? "#46E6FF" : "#7C8CFF", r: rand(1.2, 2.2), add: 1 });

/* ================= Loop & flow ================= */
let last = performance.now(), acc = 0, paused = false;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (!paused) { acc += dt; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } }
  render(); requestAnimationFrame(frame);
}
const $menu = document.getElementById("menu"), $pause = document.getElementById("pauseOv"), $end = document.getElementById("endOv"), $pauseBtn = document.getElementById("pauseBtn");
function start() { audio(); $menu.hidden = true; $end.hidden = true; newGame(); $pauseBtn.hidden = false; }
document.getElementById("startBtn").onclick = start;
document.getElementById("againBtn").onclick = start;
function toMenu() { game = null; P = null; parts.length = 0; $end.hidden = true; $pause.hidden = true; paused = false; $pauseBtn.hidden = true; $menu.hidden = false; showHi(); }
document.getElementById("menuBtn").onclick = toMenu; document.getElementById("quitBtn").onclick = toMenu;
function pauseGame() { if (paused || !game || game.state !== "play") return; paused = true; document.getElementById("pauseScore").textContent = "คะแนน " + game.score; $pause.hidden = false; document.getElementById("resumeBtn").focus(); }
$pauseBtn.onclick = pauseGame;
document.getElementById("resumeBtn").onclick = () => { paused = false; $pause.hidden = true; last = performance.now(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });
function endGame(win) {
  game.state = "over"; $pauseBtn.hidden = true;
  if (win) game.score += P.hp * 2000 + P.shield * 1000;
  const newHi = game.score > opt.hi; if (newHi) { opt.hi = game.score; saveOpt(); }
  document.getElementById("endTitle").textContent = win ? "ภารกิจสำเร็จ! 🚀" : "ยานถูกยิงตก";
  document.getElementById("endScore").textContent = game.score.toLocaleString();
  document.getElementById("endNote").innerHTML = (win ? `โบนัสชีวิตและเกราะที่เหลือรวมแล้ว<br>` : `ถึงระลอก ${Math.min(game.wave, WAVES.length)}${game.boss || game.bossIncoming ? " (บอส)" : ""}<br>`) + `ยิงเอเลี่ยนตก ${game.kills} ตัว` + (newHi ? "<br><b style='color:#FFD25A'>สถิติใหม่!</b>" : "");
  $end.hidden = false; document.getElementById("againBtn").focus();
}
function showHi() { document.getElementById("hiText").textContent = opt.hi ? "คะแนนสูงสุด " + opt.hi.toLocaleString() : ""; }
document.getElementById("soundBtn").onclick = e => { opt.sound = !opt.sound; saveOpt(); e.currentTarget.textContent = opt.sound ? "🔊" : "🔈"; if (opt.sound) audio(); };
document.getElementById("soundBtn").textContent = opt.sound ? "🔊" : "🔈";
FONT = getComputedStyle(document.body).fontFamily;
fit(); showHi(); requestAnimationFrame(frame);
</script>
